/* InviteStudio homepage — approved botanical editorial direction */
:root{--paper:#f8f4ec;--white:#fffdf8;--ink:#182b21;--muted:#77766f;--line:#e8e0d4;--gold:#b58c55;--sage:#dfe7dc;--green:#123d2c;--green2:#1d503b;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
body{background:var(--paper);color:var(--ink)}
.home-topbar{height:74px;padding:0 6.2%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbf8f1;position:sticky;top:0;z-index:20}
.home-brand{display:flex;align-items:center;gap:9px;font:500 26px var(--serif);letter-spacing:-.8px;color:#183b2b;white-space:nowrap;cursor:pointer}
.home-brand-mark{font-size:27px;color:var(--green)}
.home-nav{display:flex;gap:32px;align-items:center}
.home-nav button{border:0;background:none;color:#3c443d;padding:12px 0;cursor:pointer}
.home-nav button:hover{color:var(--gold)}
.home-actions{display:flex;align-items:center;gap:10px}
.home-actions .btn{border-radius:999px;padding:12px 23px}
.home-actions .btn.dark{background:var(--green);border-color:var(--green)}
.home-main{overflow:hidden}
.home-container{width:min(1390px,91%);margin:auto}
.home-hero{min-height:535px;display:grid;grid-template-columns:.9fr 1.1fr;gap:58px;align-items:center;padding:52px 0 42px}
.home-copy .eyebrow{font-size:10px;letter-spacing:2.6px;color:#776342}
.home-copy .eyebrow:before{display:none}
.home-copy h1{font:500 clamp(46px,5.1vw,70px)/1.04 var(--serif);letter-spacing:-2.4px;color:#102e22;margin:18px 0}
.home-copy h1 em{font-weight:400}
.home-copy p{max-width:470px;color:#73736c;font-size:15px;line-height:1.75}
.home-cta{display:flex;gap:11px;margin-top:26px;flex-wrap:wrap}
.home-cta .btn{border-radius:999px;padding:14px 23px}
.home-cta .btn.dark{background:var(--green);border-color:var(--green)}
.home-cta .btn.secondary{border-color:#a9aa9d;color:#263c30;background:transparent}
.home-proof{display:flex;align-items:center;gap:19px;flex-wrap:wrap;margin-top:25px;color:#686d63;font-size:11px}
.home-proof span{display:flex;align-items:center;gap:7px}
.home-proof b{color:#8e754a;font-size:14px;font-weight:500}
.home-visual{height:420px;position:relative;border-radius:17px;padding:0;background:#e9dfce;box-shadow:0 18px 45px #30231320}
.home-visual>img{width:100%;height:100%;object-fit:cover;display:block;border-radius:17px}
.home-visual:before,.home-visual:after{content:"✿";position:absolute;z-index:2;color:#f8f1df;text-shadow:0 3px 18px #52634466;font-size:70px;pointer-events:none}
.home-visual:before{left:-23px;bottom:15px}
.home-visual:after{right:-17px;top:-25px;color:#e7ecd9;font-size:86px}
.home-visual-label{position:absolute;left:8%;right:8%;bottom:7%;z-index:3;background:#fffdf7ed;border:1px solid #fff;border-radius:11px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 35px #40321b18}
.home-visual-label strong{font:500 22px var(--serif);color:#20382a}
.home-visual-label small{display:block;color:var(--muted);font-size:10px;margin-top:4px}
.home-benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;padding:19px 22px;margin:0 auto 36px;background:#f0ebe2;border:1px solid #e6ded1;border-radius:13px}
.home-benefit{display:flex;align-items:center;gap:11px;min-width:0}
.home-benefit-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:1px solid #d7c5a9;border-radius:50%;background:#fffaf1;color:#967647;font-size:16px}
.home-benefit strong{display:block;font-size:11px;color:#27372d}
.home-benefit small{display:block;color:#77766f;font-size:10px;line-height:1.45;margin-top:4px}
.home-section{padding:10px 0 54px}
.home-section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:22px}
.home-section-head h2{font:500 32px var(--serif);color:#173829;margin:8px 0 0;letter-spacing:-.6px}
.home-section-head p{font-size:12px;color:var(--muted);margin:7px 0 0}
.home-section-head .text-link{color:#78613d}
.home-how{background:#eee8dd;border-radius:15px;padding:27px;margin:8px 0 52px}
.home-how .steps{margin-top:20px}
.home-how .step-number{background:var(--green)}
.home-footer{border-top:1px solid var(--line);padding:25px 0;color:#77766f;font-size:11px;display:flex;justify-content:space-between}
@media(max-width:900px){.home-hero{gap:30px}.home-visual{height:350px}.home-nav{gap:16px}}
@media(max-width:700px){.home-topbar{height:64px;padding:0 4%}.home-brand{font-size:22px}.home-nav{display:none}.home-actions .btn{padding:10px 17px}.home-hero{grid-template-columns:1fr;padding:38px 0 27px;gap:24px}.home-copy h1{font-size:48px;letter-spacing:-1.5px}.home-copy p{font-size:14px}.home-visual{height:300px}.home-benefits{grid-template-columns:repeat(2,1fr);padding:15px;gap:15px}.home-section-head h2{font-size:27px}.home-how{padding:20px}.home-how .steps{grid-template-columns:1fr;gap:18px}.home-footer{flex-direction:column;gap:8px}}
@media(max-width:420px){.home-visual{height:255px}.home-copy h1{font-size:43px}.home-cta .btn{padding:12px 15px;font-size:12px}.home-proof{gap:10px}.home-benefit strong{font-size:10px}}

</style></head>

 <section class="home-section"><div class="home-section-head"><div><div class="eyebrow">THE COLLECTION</div><h2>Explore beautiful templates</h2><p>From elegant and traditional to modern and playful, find a design that feels like you.</p></div><button class="text-link" onclick="go('templates')">View all templates&nbsp; →</button></div><div class="template-grid">${templates.slice(0,4).map(templateCard).join('')}</div></section>
 <section class="home-how" id="how"><div class="eyebrow">SIMPLE FROM THE START</div><h2 class="serif" style="font-size:32px;font-weight:500;margin:10px 0">Your invitation, in three little steps.</h2><div class="steps"><div><span class="step-number">1</span><h3 class="serif">Choose a design</h3><p>Find a style that feels like you and your celebration.</p></div><div><span class="step-number">2</span><h3 class="serif">Make it yours</h3><p>Add your names, dates, photos and the details guests need.</p></div><div><span class="step-number">3</span><h3 class="serif">Share the joy</h3><p>Publish when you're ready and share your invitation with everyone.</p></div></div></section>
 </div><footer class="home-footer home-container"><span>© 2026 InviteStudio</span><span>Made for moments that matter.</span></footer>
</section></main>`}
function refreshPreview(){const p=current();const el=document.getElementById('live-preview');if(el&&p)el.innerHTML=sitePreview(p,tpl(p.templateId),false)}
function dashboard(){return `${header()}<main class="container view"><div class="page-title dashboard-head"><div><div class="eyebrow">Your creative space</div><h1>My projects</h1><p>Pick up where you left off, or start something new.</p><p class="dashboard-data-note"><strong>Drafts are saved on this device.</strong> They are not synced across browsers or devices yet.</p></div><button class="btn dark" onclick="startCreate()">＋ Create a website</button></div><div class="project-grid">${state.projects.map(p=>`<article class="project-card"><div class="project-cover">${img(tpl(p.templateId).image,p.name)}<span class="tag">${p.status||'Draft'}</span></div><div class="project-body"><h3>${esc(p.name||p.title||'Untitled event')}</h3><p>${esc(p.category)} · Edited ${esc(p.updated||'recently')}</p><div class="project-actions"><button class="btn small dark" onclick="openProject('${p.id}')">Edit</button><button class="btn small" onclick="previewProject('${p.id}')">Preview</button><button class="btn small" onclick="duplicateProject('${p.id}')">Duplicate</button></div></div></article>`).join('')}<button class="project-card" style="border:1px dashed #d3c9ba;background:transparent;display:grid;place-items:center;min-height:280px;color:#7d766b" onclick="startCreate()"><span style="font-size:32px">＋</span><strong>Start a new project</strong><span class="tiny">A new moment begins here</span></button></div></main>${footer()}`}
function openProject(id){state.currentId=id;state.page='editor';state.editorTab='Sections';render()}function duplicateProject(id){const p=state.projects.find(x=>x.id===id);const copy=JSON.parse(JSON.stringify(p));copy.id=crypto.randomUUID();copy.name=(p.name||'Project')+' copy';copy.title=(p.title||'')+' copy';copy.status='Draft';copy.published=false;copy.updated='Just now';copy.functions=(copy.functions||[]).map(f=>({...f,id:crypto.randomUUID()}));state.projects.unshift(copy);save();render();toast('Project duplicated')}
function previewTemplate(id){const t=tpl(id);state.selectedTemplate=id;state.modal={type:'template',id};const title=demoTitle(t.category);const demo={title,name:title,category:t.category,date:'2027-06-19',location:'A place to remember',message:'Together with our favourite people, for a day to remember.',story:'The best moments are the ones we share. We can’t wait to make beautiful memories with you.',functions:[{title:'The celebration',date:'19 June 2027',time:'4:00 PM',venue:'The Garden Estate',visible:true}],photos:[],sections:[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}],theme:{background:t.colors[0]||'#f5f0e7',text:t.colors[2]||'#292923',accent:t.colors[1]||'#a98958'}};renderModal(`<div class="full-template-preview"><div class="full-template-preview-head"><div><div class="eyebrow">LIVE TEMPLATE PREVIEW</div><h2 id="modal-title">${esc(t.name)}</h2><p>${esc(t.desc)} · ${esc(t.category)}</p></div><div class="template-detail-swatches">${t.colors.map(c=>`<i style="background:${c}" title="Theme color"></i>`).join('')}</div></div><div class="full-template-preview-site">${sitePreview(demo,t,true)}</div><div class="full-template-preview-actions"><span>Example content shown — your details come later.</span><button class="btn" onclick="closeModal()">Keep browsing</button><button class="btn dark" onclick="chooseTemplate('${id}')">Choose this design →</button></div></div>`)}function demoTitle(category){return ({Wedding:'A Day to Remember',Engagement:'The Beginning of Forever',Birthday:'Let’s Celebrate!',Baptism:'A Little Blessing','Baby Shower':'A Little One Is on the Way',Anniversary:'Still Falling for You',Graduation:'The Next Chapter','Corporate Event':'An Evening Together'})[category]||'A Celebration to Remember'} function chooseTemplate(id){const wasSetup=state.page==='setup'||state.templateReturnToSetup;if(state.page==='setup'&&!saveSetupFields())return;state.selectedTemplate=id;state.category=tpl(id).category;closeModal();if(wasSetup){state.templateReturnToSetup=false;const p=current();if(p){const t=tpl(id);p.templateId=id;p.category=state.category;p.theme={...(p.theme||{}),background:t.colors[0]||'#f4eee4',accent:t.colors[1]||'#a77d4d',text:t.colors[2]||'#28241f'};p.animationSettings={...(p.animationSettings||{}),effect:t.effect||'fade'};if(!save())return}state.setupStep=0;state.page='setup';render();return}startCreate(state.category);state.selectedTemplate=id;render()}
function previewProject(id){state.currentId=id;state.page='preview';render()}
function previewPage(){const p=current()||ensureProject();return `<header class="topbar"><div class="brand" onclick="go('dashboard')">Invite<span>Studio</span></div><div class="top-actions"><button class="btn" onclick="go('editor')">← Back to editor</button><button class="btn dark" onclick="openPublish()">Publish</button></div></header><main class="container" style="padding:22px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><div><strong>Website preview</strong><div class="tiny muted">Preview only · This draft is stored on this device. Public publishing and live guest RSVPs are not available yet.</div></div><div class="filters" style="margin:0"><button class="pill ${state.device==='desktop'?'active':''}" onclick="state.device='desktop';render()">Desktop</button><button class="pill ${state.device==='tablet'?'active':''}" onclick="state.device='tablet';render()">Tablet</button><button class="pill ${state.device==='mobile'?'active':''}" onclick="state.device='mobile';render()">Mobile</button></div></div><div style="max-width:${state.device==='mobile'?'390px':state.device==='tablet'?'768px':'100%'};margin:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white">${sitePreview(p,tpl(p.templateId),true)}</div></main>`}
function openPublish(){const p=current();if(!p)return;state.modal={type:'publish'};renderModal(`<div class="eyebrow">Your invitation draft</div><h2>Your preview is ready.</h2><p class="muted">You can keep personalising your invitation here. This draft is saved only in this browser on this device.</p><div style="background:#f2eee6;padding:14px;border-radius:9px;margin-top:15px;font-size:12px;line-height:1.6">✓ Preview available<br>✓ Draft saved on this device<br>○ Live website not available yet</div><div role="status" class="publish-unavailable"><strong>You can’t publish a live website yet.</strong><p>InviteStudio’s publishing service isn’t connected. This preview is not a public link, and guests can’t submit real RSVPs yet.</p></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Continue editing</button><button class="btn dark" onclick="viewInvitationPreview()">View my preview</button></div>`)}function viewInvitationPreview(){closeModal();state.page="preview";state.device="mobile";render()}function simulatePublish(){toast('Publishing is not available yet. Your draft remains saved on this device.');closeModal()}
function renderModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${content.includes('template-detail-modal')?'template-detail-shell':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`;const dlg=document.querySelector('[role=dialog]');dlg?.focus();dlg?.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...dlg.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})}function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}
function createQuickPreview(){if(!saveSetupFields())return;const p=ensureProject();if(!String(p.title||'').trim())p.title=p.category==='Wedding'?'Our wedding':'Our celebration';p.name=p.title;p.category=state.category;p.templateId=state.selectedTemplate||p.templateId;applyPreferences(p);p.updated='Just now';if(!save())return;state.page='editor';state.device='mobile';state.mobileEditorView='preview';render();toast('Your first preview is ready — add details whenever you like')}function skipSetupStep(){if(!saveSetupFields())return;state.setupStep=3;render();toast('Optional details skipped — you can add them later in the editor')}
function openInfo(type){const content=type==='pricing'?'<h2 id="modal-title">Pricing</h2><p>InviteStudio is currently a frontend prototype. No paid plans or charges are available in this demo.</p><p class="muted">Plan limits and costs will be shown clearly before any payment feature is introduced.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Got it</button></div>':'<h2 id="modal-title">Privacy & how your draft works</h2><p>Your draft is stored in this browser on this device. It is not synced to an account or another device, and clearing browser data may remove it.</p><p>Publishing and guest RSVP collection are not connected to a backend yet. Do not use this prototype to collect real guest information or sensitive details.</p><p class="muted">Cloud saving, account access, published pages and RSVP handling need appropriate security and privacy controls.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Understood</button></div>';state.modal={type:'info'};renderModal(content)}
let lastAnimatedPage=null;
function go(page){if(state.page===page){render();return}state.page=page;render()}
function render(){
 const app=document.getElementById('app');
 const page=state.page;
 app.innerHTML=page==='home'?home():page==='templates'?templatesPage():page==='setup'?setupPage():page==='editor'?editor():page==='dashboard'?dashboard():page==='preview'?previewPage():home();
 const template=tpl(state.selectedTemplate);
 const themeText=[state.category||'',state.selectedTemplate||'',template?.name||'',template?.style||''].join(' ').toLowerCase();
 let theme='luxury';
 if(/floral|flower|bloom|botanical/.test(themeText))theme='floral';
 else if(/birthday|celebration|party|event/.test(themeText))theme='celebration';
 else if(/destination|nature|garden|coastal/.test(themeText))theme='nature';
 else if(/editorial|minimal|modern|type/.test(themeText))theme='editorial';
 document.documentElement.dataset.pageTheme=theme;
 const previousPage=lastAnimatedPage;
 const motionAllowed=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const transitionClasses=['page-enter','page-enter-floral','page-enter-celebration','page-enter-nature','page-enter-editorial','page-enter-from-home'];
 app.classList.remove(...transitionClasses);
 if(previousPage!==null&&previousPage!==page&&motionAllowed){
   // Animate the entire destination view so every route—including home-to-editor,
   // home-to-template catalogue and home-to-projects—gets the same polished handoff.
   app.classList.add('page-enter','page-enter-'+theme);
   if(previousPage==='home')app.classList.add('page-enter-from-home');
   app.addEventListener('animationend',()=>app.classList.remove(...transitionClasses),{once:true});
 }
 lastAnimatedPage=page;
 window.scrollTo({top:0,behavior:'instant'});
}
bootInviteStudioCloud();
</script></body></html>
