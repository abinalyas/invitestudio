<style id="scene-templates-css">
/* Scene templates: full length, phone shaped invitation designs (Savanna, Palmera, Curtain Call, Lunaria).
 * Every rule is scoped under .sx so nothing leaks into the editor. Fonts are self hosted (CSP font-src 'self'). */
@font-face{font-family:"Pinyon Script";font-weight:400;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/pinyon-script-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Italianno";font-weight:400;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/italianno-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Great Vibes";font-weight:400;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/great-vibes-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:400;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/cormorant-garamond-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:500;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Cormorant Garamond";font-weight:600;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:400;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/montserrat-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:500;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/montserrat-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-style:normal;font-display:swap;src:url("/assets/scene-fonts/montserrat-latin-600-normal.woff2") format("woff2")}

.sx{--sx-ease:cubic-bezier(.22,1,.36,1);--sx-ink:#2b2118;--sx-muted:#5d4a3a;--sx-paper:#fff;--sx-script:"Pinyon Script",cursive;position:relative;width:100%;max-width:480px;margin:0 auto;font-family:"Montserrat",system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--sx-ink);overflow:hidden;isolation:isolate;-webkit-font-smoothing:antialiased}
.sx *,.sx *::before,.sx *::after{box-sizing:border-box}
.sx h2,.sx h3,.sx p,.sx ul,.sx ol{margin:0;padding:0}.sx ul,.sx ol{list-style:none}
.sx a{color:inherit}
.sx button{font:inherit;color:inherit}
@media(min-width:560px){.sx{box-shadow:0 0 0 1px #0000000d,0 20px 60px #3a2a1a22}}

.sx-scene{position:relative;min-height:max(640px,min(100svh,880px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 28px;overflow:hidden;isolation:isolate}
.sx-art{position:absolute;inset:0;z-index:-1}.sx-art svg{width:100%;height:100%;display:block}
.sx-content{position:relative;display:grid;gap:16px;justify-items:center;width:100%;max-width:304px}
.sx-caps{font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;overflow-wrap:anywhere}
.sx-script{font-family:var(--sx-script);font-weight:400;line-height:1.05;word-spacing:.12em;overflow-wrap:anywhere}
.sx-h{font-size:44px}
.sx-names{font-family:var(--sx-script);line-height:1;display:grid;justify-items:center;gap:2px;word-spacing:.12em;overflow-wrap:anywhere;max-width:100%}
.sx-nm{font-size:min(58px,calc(300px/(var(--nl,10)*.5)))}.sx-amp{font-size:30px;opacity:.8}
.sx-body{font-size:13px;line-height:1.75;letter-spacing:.02em;color:var(--sx-muted);text-wrap:pretty;overflow-wrap:anywhere}
.sx-date{display:grid;gap:4px;justify-items:center}.sx-day{font-family:var(--sx-script);font-size:96px;line-height:.9}
.sx-link{display:inline-flex;align-items:center;padding:8px 14px;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;transition:transform .5s var(--sx-ease),background-color .3s var(--sx-ease),color .3s var(--sx-ease)}
.sx-link:hover{background:var(--sx-ink);color:var(--sx-paper)}.sx-link:active{transform:scale(.98)}.sx-link:focus-visible,.sx-hit:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.sx-sched{display:grid;width:100%;text-align:left}
.sx-sched li{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--sx-ink) 22%,transparent)}
.sx-sched li:last-child{border-bottom:0}
.sx-tm{font-size:11px;font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sx-tm small{display:block;font-size:10px;font-weight:500;letter-spacing:.06em;opacity:.8}
.sx-ev{font-size:13px;line-height:1.4;overflow-wrap:anywhere}.sx-ev small{display:block;margin-top:2px;font-size:11px;color:var(--sx-muted)}
.sx-chev{position:absolute;left:50%;bottom:20px;width:28px;height:28px;margin-left:-14px;animation:sx-bob 2.4s var(--sx-ease) infinite;opacity:.8}
@keyframes sx-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.sx-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.sx-gallery img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.sx-more{font-size:12px}

/* Reveal: visible by default, hidden only once the script has taken over */
.sx.sx-live .sx-rv{opacity:0;transform:translateY(20px);transition:opacity .9s var(--sx-ease),transform .9s var(--sx-ease);transition-delay:calc(var(--d,0) * 110ms)}
.sx.sx-live .sx-scene.in .sx-rv{opacity:1;transform:none}

/* Savanna */
.sx-savanna{--sx-ink:#3a1c12;--sx-muted:#5d3524;--sx-paper:#fbe6c4;--sx-script:"Pinyon Script",cursive}
.sx-savanna .sx-cv-top{position:absolute;top:12%;left:0;right:0;display:grid;gap:12px;justify-items:center;padding:0 24px}
.sx-savanna .sx-cv-bot{position:absolute;bottom:7%;left:0;right:0;display:grid;gap:4px;justify-items:center;color:#fff3da;padding:0 24px}
.sx-savanna .sx-cv-bot .sx-caps{text-shadow:0 1px 8px #3c140873}
/* Palmera */
.sx-palmera{--sx-ink:#1c4f57;--sx-muted:#3f6b70;--sx-paper:#fbf1dd;--sx-script:"Italianno",cursive}
.sx-palmera .sx-cv-top{position:absolute;top:9%;left:0;right:0;display:grid;gap:8px;justify-items:center;padding:0 24px}
.sx-palmera .sx-nm{font-size:min(68px,calc(290px/(var(--nl,10)*.5)))}.sx-palmera .sx-amp{font-size:34px}
.sx-palmera .sx-cv-bot{position:absolute;bottom:5.5%;left:0;right:0;display:grid;gap:4px;justify-items:center;padding:0 24px}
.sx-palmera .sx-h{font-size:54px}.sx-palmera .sx-day{font-size:104px}
/* Curtain Call */
.sx-curtain-call{--sx-ink:#3a3226;--sx-muted:#6a5e49;--sx-paper:#f4ecd9;--sx-script:"Cormorant Garamond",serif}
.sx-curtain-call .sx-script,.sx-curtain-call .sx-names{font-weight:500;word-spacing:0}
.sx-curtain-call .sx-nm{font-size:min(54px,calc(290px/(var(--nl,10)*.5)))}.sx-curtain-call .sx-amp{font-size:28px}.sx-curtain-call .sx-h{font-size:40px}.sx-curtain-call .sx-day{font-size:88px;font-weight:500}
.sx-curtain-call .sx-cv{padding:0}
.sx-stage{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 34%,#fff7e2 0,#efe3c5 52%,#d8c8a0 100%)}
.sx-stage-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:64px 28px;transition:opacity 1.2s var(--sx-ease) .5s}
.sx-cv:not(.opened) .sx-stage-content{opacity:0}
.sx-curtain{position:absolute;top:0;bottom:0;width:50.5%;z-index:5;transition:transform 1.8s var(--sx-ease);background:repeating-linear-gradient(90deg,#d6c9ab 0 12px,#bcad87 12px 22px,#e0d4b8 22px 35px,#a89972 35px 43px)}
.sx-curtain::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#3c2d1447,transparent 22%,transparent 68%,#3c2d1438)}
.sx-curtain.l{left:0}.sx-curtain.r{right:0}
.sx-cv.opened .sx-curtain.l{transform:translateX(-102%)}.sx-cv.opened .sx-curtain.r{transform:translateX(102%)}
.sx-valance{position:absolute;left:0;right:0;top:0;height:60px;z-index:6;background:radial-gradient(circle at 50% 0,#a39469 0 19px,transparent 20px) 0 22px/40px 38px repeat-x,linear-gradient(#a39469,#a39469) 0 0/100% 22px no-repeat;filter:drop-shadow(0 4px 6px #32240e4d);transition:opacity 1.2s var(--sx-ease) .4s}
.sx-cv.opened .sx-valance{opacity:0}
.sx-emboss{position:absolute;left:0;right:0;top:40%;z-index:7;text-align:center;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:46px;line-height:1.05;color:#c4b693;text-shadow:0 1px 0 #ffffff8c,0 -1px 0 #46371959;pointer-events:none;transition:opacity .8s var(--sx-ease);padding:0 24px;overflow-wrap:anywhere}
.sx-hint{position:absolute;left:0;right:0;bottom:12%;z-index:7;text-align:center;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#6a5d3f;animation:sx-pulse 2.4s var(--sx-ease) infinite;transition:opacity .6s var(--sx-ease)}
@keyframes sx-pulse{0%,100%{opacity:.5}50%{opacity:1}}
.sx-cv.opened .sx-emboss,.sx-cv.opened .sx-hint{opacity:0;animation:none}
.sx-hit{position:absolute;inset:0;z-index:8;border:0;background:transparent;cursor:pointer}.sx-cv.opened .sx-hit{display:none}
.sx-cv .sx-chev{opacity:0;transition:opacity 1s var(--sx-ease) 1.2s}.sx-cv.opened .sx-chev{opacity:.8}
/* Lunaria */
.sx-lunaria{--sx-ink:#1f2b3d;--sx-muted:#34445c;--sx-paper:#e9eef5;--sx-script:"Great Vibes",cursive}
.sx-lunaria .sx-cv-mid{position:absolute;top:28%;left:0;right:0;display:grid;gap:14px;justify-items:center;padding:0 72px}
.sx-lunaria .sx-cv-bot{position:absolute;bottom:5.5%;left:0;right:0;display:grid;gap:4px;justify-items:center;padding:0 24px}
.sx-lunaria .sx-nm{font-size:min(54px,calc(250px/(var(--nl,10)*.5)))}

@media(prefers-reduced-motion:reduce){
 .sx.sx-live .sx-rv{transform:none;transition:opacity .4s linear}
 .sx-chev,.sx-hint{animation:none}
 .sx-curtain{transition:opacity .6s linear,transform 0s}.sx-cv.opened .sx-curtain{opacity:0}
}
</style><!--/scene-templates-css-->

.tpl-mn *{box-sizing:border-box}
.tpl-mn{--ivory:#FAF9F6;--tint:#F0EFE9;--ink:#292929;--muted:#6b6a63;--line:#E6E3DD;--olive:#5c6350;--olive-line:#777E68;--serif:"DM Serif Display",Georgia,serif;--sans:"Inter",Arial,sans-serif;--pad:max(32px,calc((100cqw - 1240px)/2));--pad-narrow:max(32px,calc((100cqw - 1120px)/2));container-type:inline-size;position:relative;width:100%;margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:clip;-webkit-font-smoothing:antialiased}
.tpl-mn img{display:block;width:100%;height:100%;object-fit:cover}
.tpl-mn a{color:inherit;text-decoration:none}
.tpl-mn button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.tpl-mn h1,.tpl-mn h2,.tpl-mn p,.tpl-mn figure{margin-top:0}
.tpl-mn figure{margin:0}
.tpl-mn [data-tpl-section]{scroll-margin-top:90px}
.tpl-mn .mn-site-header{height:82px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(250,249,246,.96);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.tpl-mn .mn-wordmark,.tpl-mn .mn-footer-mark{font:28px var(--serif);letter-spacing:-2px}
.tpl-mn .mn-wordmark span,.tpl-mn .mn-footer-mark span{color:var(--olive);font:18px var(--sans);padding:0 2px}
.tpl-mn .mn-desktop-nav{display:flex;gap:38px;margin-left:70px;margin-right:auto}
.tpl-mn .mn-desktop-nav button,.tpl-mn .mn-nav-rsvp,.tpl-mn .mn-eyebrow,.tpl-mn .mn-hero-date,.tpl-mn .mn-text-link,.tpl-mn .mn-section-heading span,.tpl-mn .mn-month,.tpl-mn .mn-year,.tpl-mn .mn-detail-row>span,.tpl-mn .mn-timeline-item small,.tpl-mn .mn-gallery-caption,.tpl-mn .mn-footer>p,.tpl-mn .mn-footer>span{font-size:9px;letter-spacing:1.45px;font-weight:600}
.tpl-mn .mn-desktop-nav button{color:var(--muted)}
.tpl-mn .mn-nav-rsvp{border-bottom:1px solid var(--ink);padding:8px 0}

.tpl-mn .mn-hero{min-height:700px;position:relative;display:grid;grid-template-columns:46% 54%;align-items:center;padding:48px var(--pad);overflow:hidden}
.tpl-mn .mn-hero-copy{position:relative;z-index:2;padding:25px 0 50px}

.tpl-mn .mn-hero h1[data-long]{font-size:min(clamp(56px,8cqw,110px),var(--fit))}
.tpl-mn .mn-hero h1 em,.tpl-mn h2 em{font-weight:400;color:var(--olive)}
.tpl-mn .mn-period{color:var(--olive)}
.tpl-mn .mn-hero-date{color:var(--muted);letter-spacing:1.2px}

.tpl-mn .mn-backdrop-mark{font:clamp(90px,14cqw,190px)/1 var(--serif);letter-spacing:-6px;color:var(--ink)}

.tpl-mn .mn-countdown-section{background:var(--tint);padding:76px var(--pad);display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:50px}

.tpl-mn .mn-section-heading{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-bottom:55px}

function ensureProject(){let p=current();if(!p){p={id:crypto.randomUUID(),name:'Untitled event',category:state.category,templateId:state.selectedTemplate,status:'Draft',updated:'Just now',title:'',date:'',location:'',message:'',story:'',functions:[],theme:{background:'#f4eee4',accent:'#a77d4d',text:'#28241f'},published:false};state.projects.unshift(p);state.currentId=p.id}return p}
function applyPreferences(p){if(!p)return;const palette=p.preferences?.palette||'champagne';const palettes={champagne:{background:'#f4eee4',accent:'#a88754',text:'#28241f'},sage:{background:'#edf0e7',accent:'#7d8b70',text:'#2b3028'},blush:{background:'#f5e8e5',accent:'#b47e83',text:'#382b2c'},noir:{background:'#272723',accent:'#c6a56b',text:'#f7f0e4'},blue:{background:'#e9eef2',accent:'#819bad',text:'#26313a'},earth:{background:'#eee3d6',accent:'#ad6f4f',text:'#342a24'}};const chosen=palettes[palette];if(chosen){p.theme={...(p.theme||{}),...chosen};}if(document.getElementById('accentColor'))p.theme.accent=document.getElementById('accentColor').value;if(p.preferences?.rsvp==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='rsvp');if(section)section.visible=false;}if(p.preferences?.gallery==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}if(p.preferences?.gallery==='hero'&&p.sections){const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}}
function saveSetupFields(){if(state.page!=='setup')return true;let p=current();if(!p&&state.setupStep===0){p=ensureProject()}if(!p)return true;const v=id=>document.getElementById(id)?.value;const previousCategory=p.category;if(v('eventCategory')){state.category=v('eventCategory');p.category=state.category;if(previousCategory!==state.category){const compatible=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(compatible)state.selectedTemplate=compatible.id;}}if(v('projectTitle')!==undefined)p.title=v('projectTitle');if(v('projectDate')!==undefined)p.date=v('projectDate');if(v('projectLocation')!==undefined)p.location=v('projectLocation');if(v('projectMessage')!==undefined)p.message=v('projectMessage');if(v('projectStory')!==undefined)p.story=v('projectStory');if(v('projectHosts')!==undefined)p.hosts=v('projectHosts');if(v('prefRsvp')!==undefined){p.preferences={...(p.preferences||{}),rsvp:v('prefRsvp')}}p.name=p.title||p.name;p.category=state.category;p.templateId=state.selectedTemplate;return save()}
function addFunction(){saveSetupFields();const p=ensureProject();p.functions.push({id:crypto.randomUUID(),title:'New function',date:'',time:'',venue:'',visible:true});save();render();editFunction(p.functions[p.functions.length-1].id)}function editFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!f)return;state.modal={type:'function',id};renderModal(`<h2 id="modal-title">Edit function</h2><p class="muted">Use any title that fits your event. All fields except the title are optional.</p><div class="form-grid"><div class="field full"><label for="fnTitle">Function name</label><input id="fnTitle" value="${esc(f.title)}" placeholder="e.g. Wedding Ceremony" required></div><div class="field"><label for="fnDate">Date</label><input type="date" id="fnDate" value="${esc(f.date||'')}"></div><div class="field"><label for="fnTime">Start time</label><input type="time" id="fnTime" value="${esc(f.time||'')}"></div><div class="field"><label for="fnEndTime">End time</label><input type="time" id="fnEndTime" value="${esc(f.endTime||'')}"></div><div class="field"><label for="fnDress">Dress code</label><input id="fnDress" value="${esc(f.dressCode||'')}"></div><div class="field full"><label for="fnVenue">Venue</label><input id="fnVenue" value="${esc(f.venue||'')}" placeholder="Venue name or address"></div><div class="field full"><label for="fnDirections">Directions link</label><input id="fnDirections" type="url" value="${esc(f.directionsUrl||'')}" placeholder="https://…"></div><details class="field full logistics-details"><summary>More guest information <span class="muted">(optional)</span></summary><div class="field full"><label for="fnParking">Parking information</label><textarea id="fnParking" placeholder="Parking, drop-off or access details">${esc(f.parking||'')}</textarea></div><div class="field full"><label for="fnAccommodation">Accommodation and travel</label><textarea id="fnAccommodation" placeholder="Nearby hotels or transport tips">${esc(f.accommodation||'' return;closeModal();render();toast('Function saved locally')}function removeFunction(id){const p=current();if(!p)return;const f=p.functions.find(x=>x.id===id);if(!f||!confirm(`Remove “${f.title}” from this draft? This cannot be undone in the prototype.`))return;p.functions=p.functions.filter(x=>x.id!==id);save();render();toast('Function removed')}function moveFunction(id,delta){const p=current();if(!p)return;const i=p.functions.findIndex(f=>f.id===id),j=i+delta;if(i<0||j<0||j>=p.functions.length)return;[p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]];if(save())render();else [p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]]}function toggleFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const previous=f.visible;f.visible=f.visible===false;if(save())render();else f.visible=previous}function duplicateFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!p||!f)return;const copy={...f,id:crypto.randomUUID(),title:f.title+' (copy)'};p.functions.splice(p.functions.indexOf(f)+1,0,copy);save();render();toast('Function duplicated')}

function addCustomSection(){const p=current();if(!p)return;p.sections=p.sections||[{id:'hero',title:'Hero',visible:true},{id:'welcome',title:'Welcome message',visible:true},{id:'story',title:'Our story',visible:true},{id:'functions',title:'Events / Functions',visible:true},{id:'gallery',title:'Gallery',visible:true},{id:'rsvp',title:'RSVP',visible:true}];const sec={id:crypto.randomUUID(),title:'New section',content:'Add your message here.',visible:true,custom:true};p.sections.push(sec);state.activeSection=sec.id;save();render()}function updateCustomSection(id,key,value){const sec=current()?.sections?.find(x=>x.id===id&&x.custom);if(!sec)return;sec[key]=value;save();refreshPreview()}function removeCustomSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id&&x.custom);if(!p||!sec||!confirm(`Remove “${sec.title}” from this draft?`))return;p.sections=p.sections.filter(x=>x.id!==id);state.activeSection='Sections';save();render()}function openSection(id){const map={hero:'Content',welcome:'Content',story:'Content',functions:'Events / Functions',gallery:'Photos',rsvp:'Settings'};state.activeSection=id;state.editorTab=map[id]||(current()?.sections?.find(x=>x.id===id)?.custom?'Sections':'Content');render()}function moveSection(id,delta){const p=current();if(!p)return;const a=p.sections||[],i=a.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(save())render();else [a[i],a[j]]=[a[j],a[i]]}function toggleSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id);if(!sec)return;const previous=sec.visible;sec.visible=!sec.visible;if(save()){render();refreshPreview()}else sec.visible=previous}function updateProject(key,value){const p=current();if(!p)return;p[key]=value;if(key==='title')p.name=value||'Untitled event';if(key==='category'){state.category=value;const compatible=templates.find(t=>t.category===value||t.category===categoryAlias(value));if(compatible){p.templateId=compatible.id;state.selectedTemplate= ay',Anniversary:'Still Falling for You',Graduation:'The Next Chapter','Corporate Event':'An Evening Together'})[category]||'A Celebration to Remember'} function chooseTemplate(id){const wasSetup=state.page==='setup'||state.templateReturnToSetup;if(state.page==='setup'&&!saveSetupFields())return;state.selectedTemplate=id;state.category=tpl(id).category;closeModal();if(wasSetup){state.templateReturnToSetup=false;const p=current();if(p){const t=tpl(id);p.templateId=id;p.category=state.category;p.theme={...(p.theme||{}),background:t.colors[0]||'#f4eee4',accent:t.colors[1]||'#a77d4d',text:t.colors[2]||'#28241f'};p.animationSettings={...(p.animationSettings||{}),effect:t.effect||'fade'};if(!save())return}state.setupStep=0;state.page='setup';render();return}startCreate(state.category,id)}

function previewPage(){const p=current()||ensureProject();return `<header class="topbar"><div class="brand" onclick="go('dashboard')">Invite<span>Studio</span></div><div class="top-actions"><button class="btn" onclick="go('editor')">← Back to editor</button><button class="btn dark" onclick="openPublish()">Share invitation</button></div></header><main class="container" style="padding:22px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><div><strong>Website preview</strong><div class="tiny muted"><strong>Private preview.</strong> ${esc(previewNote(p))} ${esc(draftNote())}</div></div><div class="filters" style="margin:0"><button class="pill ${state.device==='desktop'?'active':''}" onclick="state.device='desktop';render()">Desktop</button><button class="pill ${state.device==='tablet'?'active':''}" onclick="state.device='tablet';render()">Tablet</button><button class="pill ${state.device==='mobile'?'active':''}" onclick="state.device='mobile';render()">Mobile</button></div></div><div style="max-width:${state.device==='mobile'?'390px':state.device==='tablet'?'768px':'100%'};margin:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white">${sitePreview(p,tpl(p.templateId),true)}</div></main>`}
function openPublish(){const p=current();if(!p)return;if(typeof window.openCloudPublish==='function'&&window.openCloudPublish(p))return;state.modal={type:'publish'};renderModal(`<div class="eyebrow">Your invitation draft</div><h2>Your preview is ready.</h2><p class="muted">You can keep personalising your invitation here. ${esc(draftNote())}</p><div style="background:#f2eee6;padding:14px;border-radius:9px;margin-top:15px;font-size:12px;line-height:1.6">✓ Preview available<br>✓ Draft saved on this device<br>○ Live website not available yet</div><div role="status" class="publish-unavailable"><strong>You can’t publish a live website yet.</strong><p>InviteStudio’s publishing service isn’t connected. This preview is not a public link, and guests can’t submit real RSVPs yet.</p></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Continue editing</button><button class="btn dark" onclick="viewInvitationPreview()">View my preview</button></div>`)}function viewInvitationPreview(){closeModal();state.page="preview";state.device="mobile";render()}function simulatePublish(){toast('Publishing is not available yet. Your draft remains saved on this device.');closeModal()}
function renderModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${content.includes('template-detail-modal')?'template-detail-shell':content.includes('full-template-preview')?'template-preview-shell':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`;const dlg=document.querySelector('[role=dialog]');dlg?.focus();dlg?.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...dlg.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})}function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}

function openInfo(type){const content=type==='pricing'?'<h2 id="modal-title">Pricing</h2><p>InviteStudio is currently a frontend prototype. No paid plans or charges are available in this demo.</p><p class="muted">Plan limits and costs will be shown clearly before any payment feature is introduced.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Got it</button></div>':'<h2 id="modal-title">Privacy & how your draft works</h2><p>Your draft is saved automatically. When cloud saving is available, a copy is stored privately in InviteStudio’s cloud and this browser keeps a backup so you can continue here.</p><p>Your private edit link is the key to your draft. Anyone who has it can edit the draft, so keep it safe. Clearing this browser’s data removes only the same-device shortcut.</p><p>Publishing and guest RSVP collection are not connected to a backend yet. Do not use this prototype to collect real guest information or sensitive details.</p><p class="muted">Published pages and RSVP handling need a further security and privacy review before launch.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Understood</button></div>';state.modal={type:'info'};renderModal(content)}
let lastAnimatedPage=null;
function go(page){if(state.page===page){render();return}state.page=page;render()}
function render(){
 const app=document.getElementById('app');
 const page=state.page;
 if(typeof unmountInviteStudioIsland==='function')unmountInviteStudioIsland();
 const island=typeof inviteStudioIslandRoute==='function'?inviteStudioIslandRoute():null;
 app.innerHTML=island?'<div class="figma-island-host"></div>':page==='public'?publicPageHtml():page==='home'?home():page==='templates'?templatesPage():page==='setup'?setupPage():page==='editor'?editor():page==='dashboard'?dashboard():page==='preview'?previewPage():home();
 const template=tpl(state.selectedTemplate);
 const themeText=[state.category||'',state.selectedTemplate||'',template?.name||'',template?.style||''].join(' ').toLowerCase();
 let theme='luxury';
 if(/floral|flower|bloom|botanical/.test(themeText))theme='floral';
 else if(/birthday|celebration|party|event/.test(themeText))theme='celebration';
 else if(/destination|nature|garden|coastal/.test(themeText))theme='nature';
 else if(/editorial|minimal|modern|type/.test(themeText))theme='editorial';
 document.documentElement.dataset.pageTheme=theme;
 if(island&&typeof mountInviteStudioIsland==='function')mountInviteStudioIsland(island);
 const previousPage=lastAnimatedPage;
 const motionAllowed=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const transitionClasses=['page-enter','page-enter-floral','page-enter-celebration','page-enter-nature','page-enter-editorial','page-enter-from-home'];
 app.classList.remove(...transitionClasses);
 if(previousPage!==null&&previousPage!==page&&motionAllowed){
   // Animate the entire destination view so every route—including home-to-editor,
   // home-to-template catalogue and home-to-projects—gets the same polished handoff.
   app.classList.add('page-enter','page-enter-'+theme);
   if(previousPage==='home')app.classList.add('page-enter-from-home');
   app.addEventListener('animationend',()=>app.classList.remove(...transitionClasses),{once:true});
 }
 lastAnimatedPage=page;
 window.scrollTo({top:0,behavior:'instant'});
}
bootInviteStudioCloud();
</script></body></html>
