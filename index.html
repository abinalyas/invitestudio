/* Setup on a phone: the four steps fit in one row, with no sideways scrolling. */
@media (max-width: 767px) {

/* Large screens: only the home page is scaled up on wide monitors (it was drawn for a ~1500px-wide viewport and looked
   tiny at 100% browser zoom there), in gentle steps (e.g. 2560px wide ~ 135% zoom). Every other island (templates,
   template detail, setup wizard, editor) keeps zoom 1. data-island is set to the route kind by figma-host.js.
   --z must match zoom: islands.css divides 100vh by it. */

function setupStepContent(step,p){

function functionPresetPicker(p){const presets=eventPresetsFor(p);const added=new Set((p.functions||[]).map(f=>f.title.toLowerCase()));return `<div class="function-preset-picker"><div class="preset-picker-heading"><strong>Quick-add ${esc(p.category==='Wedding'?'wedding functions':'event moments')}</strong><small>Tap any option to add it to your schedule.</small></div><div class="function-preset-chips">${presets.map(title=>`<button type="button" class="function-preset-chip ${added.has(title.toLowerCase())?'is-added':''}" onclick="addFunctionPreset('${title}')" ${added.has(title.toLowerCase())?'aria-label="'+esc(title)+' already added"':''}>${added.has(title.toLowerCase())?'✓ ':'+ '}${esc(title)}</button>`).join('')}</div></div>`}

function ensureProject(){let p=current();if(!p){p={id:crypto.randomUUID(),name:'Untitled event',category:state.category,templateId:state.selectedTemplate,status:'Draft',updated:'Just now',title:'',date:'',location:'',message:'',story:'',functions:[],theme:{background:'#f4eee4',accent:'#a77d4d',text:'#28241f'},published:false};state.projects.unshift(p);state.currentId=p.id}return p}
function applyPreferences(p){if(!p)return;const palette=p.preferences?.palette||'champagne';const palettes={champagne:{background:'#f4eee4',accent:'#a88754',text:'#28241f'},sage:{background:'#edf0e7',accent:'#7d8b70',text:'#2b3028'},blush:{background:'#f5e8e5',accent:'#b47e83',text:'#382b2c'},noir:{background:'#272723',accent:'#c6a56b',text:'#f7f0e4'},blue:{background:'#e9eef2',accent:'#819bad',text:'#26313a'},earth:{background:'#eee3d6',accent:'#ad6f4f',text:'#342a24'}};const chosen=palettes[palette];if(chosen){p.theme={...(p.theme||{}),...chosen};}if(document.getElementById('accentColor'))p.theme.accent=document.getElementById('accentColor').value;if(p.preferences?.rsvp==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='rsvp');if(section)section.visible=false;}if(p.preferences?.gallery==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}if(p.preferences?.gallery==='hero'&&p.sections){const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}}
function saveSetupFields(){if(state.page!=='setup')return true;let p=current();if(!p&&state.setupStep===0){p=ensureProject()}if(!p)return true;const v=id=>document.getElementById(id)?.value;const previousCategory=p.category;if(v('eventCategory')){state.category=v('eventCategory');p.category=state.category;if(previousCategory!==state.category){const compatible=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(compatible)state.selectedTemplate=compatible.id;}}if(v('projectTitle')!==undefined)p.title=v('projectTitle');if(v('projectDate')!==undefined)p.date=v('projectDate');if(v('projectLocation')!==undefined)p.location=v('projectLocation');if(v('projectMessage')!==undefined)p.message=v('projectMessage');if(v('projectStory')!==undefined)p.story=v('projectStory');if(v('projectHosts')!==undefined)p.hosts=v('projectHosts');if(v('prefRsvp')!==undefined){p.preferences={...(p.preferences||{}),rsvp:v('prefRsvp')}}p.name=p.title||p.name;p.category=state.category;p.templateId=state.selectedTemplate;return save()}
function addFunction(){saveSetupFields();const p=ensureProject();p.functions.push({id:crypto.randomUUID(),title:'New function',date:'',time:'',venue:'',visible:true});save();render();editFunction(p.functions[p.functions.length-1].id)}function editFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!f)return;state.modal={type:'function',id};renderModal(`<h2 id="modal-title">Edit function</h2><p class="muted">Use any title that fits your event. All fields except the title are optional.</p><div class="form-grid"><div class="field full"><label for="fnTitle">Function name</label><input id="fnTitle" value="${esc(f.title)}" placeholder="e.g. Wedding Ceremony" required></div><div class="field"><label for="fnDate">Date</label><input type="date" id="fnDate" onclick="try{this.showPicker&&this.showPicker()}catch(e){}" value="${esc(f.date||'')}"></div><div class="field"><label for="fnTime">Start time</label><input type="time" id="fnTime" value="${esc(f.time||'')}"></div><div class="field"><label for="fnEndTime">End time</label><input type="time" id="fnEndTime" value="${esc(f.endTime||'')}"></div><div class="field"><label for="fnDress">Dress code</label><input id="fnDress" value="${esc(f.dressCode||'')}"></div><div class="field full"><label for="fnVenue">Venue</label><input id="fnVenue" value="${esc(f.venue||'')}" placeholder="Venue name or address"></div><div class="field full"><label for="fnDirections">Directions link</label><input id="fnDirections" type="url" value="${esc(f.directionsUrl||'')}" placeholder="https://…"></div><details class="field full logistics-details"><summary>More guest information <span class="muted">(optional)</span></summary><div class="field full"><label for="fnParking">Parking information</label><textarea id="fnParking" placeholder="Parking, drop-off or access details">${esc(f.parking||'')}</textarea></div><div class="field full"><label for="fnAccommodation">Accommodation and travel</label><textarea id="fnAccommodation" placeholder="Nearby hotels or transport tips">${esc(f.accommodation||'')}</textarea></div><div class="field full"><label for="fnAccessibility">Accessibility information</label><textarea id="fnAccessibility" placeholder="Step-free access, seating or access needs">${esc(f.accessibility||'')}</textarea></div></details><div class="field full"><label for="fnDescription">Description or guest notes</label><textarea id="fnDescription">${esc(f.description||'')}</textarea></div><div class="field full"><label><input id="fnVisible" type="checkbox" ${f.visible===false?'':'checked'} style="width:auto"> Show this function on the invitation</label></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="saveFunction('${id}')">Save function</button></div>`)}function saveFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const title=document.getElementById('fnTitle').value.trim();if(!title){document.getElementById('fnTitle').setCustomValidity('Please enter a function name.');document.getElementById('fnTitle').reportValidity();return}f.title=title;f.date=document.getElementById('fnDate').value;f.time=document.getElementById('fnTime').value;f.endTime=document.getElementById('fnEndTime').value;f.venue=document.getElementById('fnVenue').value.trim();f.directionsUrl=document.getElementById('fnDirections').value.trim();f.description=document.getElementById('fnDescription').value.trim();f.dressCode=document.getElementById('fnDress').value.trim();f.parking=document.getElementById('fnParking')?.value.trim()||'';f.accommodation=document.getElementById('fnAccommodation')?.value.trim()||'';f.accessibility=document.getElementById('fnAccessibility')?.value.trim()||'';const start=f.time,end=f.endTime;const endField=document.getElementById('fnEndTime');endField.setCustomValidity('');if(start&&end&&end<start){endField.setCustomValidity('End time must be after the start time.');endField.reportValidity();return}f.visible=document.getElementById('fnVisible').checked;if(!save())return;closeModal();render();toast('Function saved locally')}function removeFunction(id){const p=current();if(!p)return;const f=p.functions.find(x=>x.id===id);if(!f||!confirm(`Remove “${f.title}” from this draft? This cannot be undone in the prototype.`))return;p.functions=p.functions.filter(x=>x.id!==id);save();render();toast('Function removed')}function moveFunction(id,delta){const p=current();if(!p)return;const i=p.functions.findIndex(f=>f.id===id),j=i+delta;if(i<0||j<0||j>=p.functions.length)return;[p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]];if(save())render();else [p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]]}function toggleFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const previous=f.visible;f.visible=f.visible===false;if(save())render();else f.visible=previous}function duplicateFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!p||!f)return;const copy={...f,id:crypto.randomUUID(),title:f.title+' (copy)'};p.functions.splice(p.functions.indexOf(f)+1,0,copy);save();render();toast('Function duplicated')}



function introSequenceFor(t){const profiles=['cinematic','floral','envelope','monogram','editorial','celebration','nature','type','storybook','light','botanical','spotlight'];const id=t.id||t.name;let h=0,h2=5381;for(let i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))>>>0;h2=((h2<<5)-h2+id.charCodeAt(id.length-1-i))>>>0}const sequence=h2%12;return {profile:t.introProfile||profiles[h%profiles.length],sequence,flourish:['orbit','petals','fold','monogram','paper','confetti','landscape','letters','illustration','light','vine','spotlight'][sequence],duration:5.2+(h2%4)*.45,transition:['dissolve','fold','wipe','soft-zoom'][h%4]}}
function introProfile(t,p){return resolvedIntroStyle(p,t)}

tion skipInvitationIntro(el){const intro=el.closest('.invitation-intro');if(intro){const audio=intro.querySelector('audio');if(audio){audio.pause();audio.currentTime=0}intro.classList.add('intro-exit');setTimeout(()=>intro.remove(),matchMedia('(prefers-reduced-motion: reduce)').matches?0:520)}}function replayInvitationIntro(btn){const wrap=btn.closest('.invitation-motion');const old=wrap&&wrap.querySelector('.invitation-intro');if(old){const copy=old.cloneNode(true);old.remove();wrap.prepend(copy)}}function toggleIntroAudio(btn){const intro=btn.closest('.invitation-intro');const audio=intro&&intro.querySelector('audio');if(!audio)return;if(audio.paused){audio.play().then(()=>{btn.textContent='Ⅱ Mute sound'}).catch(()=>toast('Audio could not be played on this device'))}else{audio.pause();audio.currentTime=0;btn.textContent='♫ Play sound'}}function uploadIntroAudio(file){if(!file)return;const p=current();if(!p)return;if(file.size>700000){toast('Please choose audio under 700 KB');return}const reader=new FileReader();reader.onload=()=>{p.introSettings={...(p.introSettings||{}),audio:reader.result};if(save()){render();toast('Optional intro music added')}};reader.readAsDataURL(file)}

function templateDemoProject(t){return{title:'Daniel & Amelia',name:'Daniel & Amelia',category:t.category,date:'2027-06-19',location:'The Garden Estate, A place to remember',hosts:'Together with their families',message:'Together with our favourite people, for a day to remember.',story:'The best moments are the ones we share. We can’t wait to make beautiful memories with you.',functions:[{id:'demo-1',title:'The celebration',date:'2027-06-19',time:'16:00',venue:'The Garden Estate',visible:true},{id:'demo-2',title:'Dinner and dancing',date:'2027-06-19',time:'19:00',venue:'The Garden Estate',visible:true}],photos:[],sections:[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}],theme:{background:t.colors[0]||'#f5f0e7',text:t.colors[2]||'#292923',accent:t.colors[1]||'#a98958'}}}
function previewTemplate(id){const t=tpl(id);state.selectedTemplate=id;state.modal={type:'template',id};const mine=current();const ownNames=String(mine&&mine.title||'').trim();const title=ownNames||(t.category==='Wedding'?'Daniel & Amelia':demoTitle(t.category));const demo={title,name:title,category:t.category,date:(ownNames&&mine.date)||'2027-06-19',location:(ownNames&&mine.location)||'A place to remember',hosts:ownNames?(mine.hosts||''):'',message:'Together with our favourite people, for a day to remember.',story:'The best moments are the ones we share. We can’t wait to make beautiful memories with you.',functions:[{title:'The celebration',date:'19 June 2027',time:'4:00 PM',venue:'The Garden Estate',visible:true}],photos:[],sections:[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}],theme:{background:t.colors[0]||'#f5f0e7',text:t.colors[2]||'#292923',accent:t.colors[1]||'#a98958'}};renderModal(`<div class="full-template-preview"><div class="full-template-preview-head"><div><div class="eyebrow">LIVE TEMPLATE PREVIEW</div><h2 id="modal-title">${esc(t.name)}</h2><p>${esc(t.desc)} · ${esc(t.category)}</p></div><div class="template-detail-swatches">${t.colors.map(c=>`<i style="background:${c}" title="Theme color"></i>`).join('')}</div></div><div class="full-template-preview-site">${sitePreview(demo,t,true)}</div><div class="full-template-preview-actions"><span>${ownNames?'Your names are shown on this design. The rest is example content.':'Example names shown — you add yours when you start.'}</span><button class="btn" onclick="closeModal()">Keep browsing</button><button class="btn dark" onclick="chooseTemplate('${id}')">Choose this design →</button></div></div>`)}function demoTitle(category){return ({Wedding:'A Day to Remember',Engagement:'The Beginning of Forever',Birthday:'Let’s Celebrate!',Baptism:'A Little Blessing','Baby Shower':'A Little One Is on the Way',Anniversary:'Still Falling for You',Graduation:'The Next Chapter','Corporate Event':'An Evening Together'})[category]||'A Celebration to Remember'} function chooseTemplate(id){const wasSetup=state.page==='setup'||state.templateReturnToSetup;if(state.page==='setup'&&!saveSetupFields())return;state.selectedTemplate=id;state.category=tpl(id).category;closeModal();if(wasSetup){state.templateReturnToSetup=false;const p=current();if(p){const t=tpl(id);p.templateId=id;p.category=state.category;p.theme={...(p.theme||{}),background:t.colors[0]||'#f4eee4',accent:t.colors[1]||'#a77d4d',text:t.colors[2]||'#28241f'};p.animationSettings={...(p.animationSettings||{}),effect:t.effect||'fade'};if(!save())return}state.setupStep=0;state.page='setup';render();return}startCreate(state.category,id)}
function previewProject(id){state.currentId=id;state.page='preview';render()}
function previewPage(){const p=current()||ensureProject();const dev=(k,label)=>`<button class="pv-pill ${state.device===k?'active':''}" onclick="state.device='${k}';render()">${label}</button>`;return `<header class="pv-top"><a class="pv-logo" href="/" onclick="go('dashboard');return false" aria-label="InviteStudio home"><span class="pv-mark"><i></i><i></i><i></i><i></i></span><span>InviteStudio</span></a><div class="pv-actions"><button class="pv-btn keep" onclick="go('editor')">← Back<span class="pv-long"> to editor</span></button><button class="pv-btn primary" onclick="openPublish()">Share<span class="pv-long"> invitation</span></button></div></header><main class="pv-main"><div class="pv-bar"><div><strong class="pv-title">Invitation preview</strong><div class="pv-note"><strong>Private preview.</strong> ${esc(previewNote(p))} ${esc(draftNote())}</div></div><div class="pv-devices">${dev('desktop','Desktop')}${dev('tablet','Tablet')}${dev('mobile','Mobile')}</div></div><div class="preview-fit"><div id="preview-frame" data-w="${state.device==='mobile'?390:state.device==='tablet'?768:1280}" style="width:${state.device==='mobile'?390:state.device==='tablet'?768:1280}px;margin:auto;border:1px solid #e7e0d9;border-radius:14px;overflow:hidden;background:white">${sitePreview(p,tpl(p.templateId),true)}</div></div></main>`}
function openPublish(){const p=current();if(!p)return;if(typeof window.openCloudPublish==='function'&&window.openCloudPublish(p))return;state.modal={type:'publish'};renderModal(`<div class="eyebrow">Your invitation draft</div><h2>Your preview is ready.</h2><p class="muted">You can keep personalising your invitation here. ${esc(draftNote())}</p><div style="background:#f2eee6;padding:14px;border-radius:9px;margin-top:15px;font-size:12px;line-height:1.6">✓ Preview available<br>✓ Draft saved on this device<br>○ Going live is not available yet</div><div role="status" class="publish-unavailable"><strong>You can’t publish your invitation yet.</strong><p>InviteStudio’s publishing service isn’t connected. This preview is not a public link, and guests can’t submit real RSVPs yet.</p></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Continue editing</button><button class="btn dark" onclick="viewInvitationPreview()">View my preview</button></div>`)}function viewInvitationPreview(){closeModal();state.page="preview";state.device="mobile";render()}function simulatePublish(){toast('Publishing is not available yet. Your draft remains saved on this device.');closeModal()}
function renderModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${content.includes('template-detail-modal')?'template-detail-shell':content.includes('full-template-preview')?'template-preview-shell':''}${content.includes('pub-shell')?' publish-shell':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`;const dlg=document.querySelector('[role=dialog]');dlg?.focus();dlg?.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...dlg.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})}/* A styled confirmation (replaces the browser's plain confirm box). Resolves true to go ahead, false to cancel. It sits above any open dialog. */
window.inviteConfirm=function inviteConfirm(o){o=o||{};return new Promise(resolve=>{const prev=document.activeElement;let root=document.getElementById('confirm-root');if(!root){root=document.createElement('div');root.id='confirm-root';document.body.appendChild(root)}
 const done=ok=>{root.innerHTML='';document.removeEventListener('keydown',onKey,true);if(prev&&prev.focus)try{prev.focus()}catch(e){}resolve(ok)};
 const onKey=e=>{if(e.key==='Escape'){e.stopPropagation();done(false)}else if(e.key==='Tab'){const els=[...root.querySelectorAll('button')];if(!els.length)return;const f=els[0],l=els[els.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}};
 root.innerHTML=`<div class="modal-backdrop confirm-backdrop" role="presentation"><section class="modal confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text" tabindex="-1"><h2 id="confirm-title">${esc(o.title||'Are you sure?')}</h2><p id="confirm-text" class="muted">${esc(o.message||'')}</p><div class="modal-actions"><button class="btn" type="button" data-confirm-cancel>${esc(o.cancelLabel||'Cancel')}</button><button class="btn dark${o.danger?' danger':''}" type="button" data-confirm-ok>${esc(o.confirmLabel||'Confirm')}</button></div></section></div>`;
 root.querySelector('[data-confirm-cancel]').addEventListener('click',()=>done(false));root.querySelector('[data-confirm-ok]').addEventListener('click',()=>done(true));
 root.querySelector('.confirm-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)done(false)});
 document.addEventListener('keydown',onKey,true);setTimeout(()=>{const b=root.querySelector('[data-confirm-cancel]');b&&b.focus()},0)})};
function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}
// Opens the share card (share-card.js) for a live invitation: the design's own artwork, the public link and the couple's events.
window.openShareCard=function(p){p=p||current();if(!p||!window.InviteShareCard)return;const t=tpl(p.templateId);const b=document.querySelector('meta[name="invitestudio-build"]');const art=String(t.image||'').replace(/\.png$/,'-wide.jpg')+(b&&b.content?'?v='+b.content:'');const slug=p.publicSlug;window.InviteShareCard.open(p,{art:art,url:slug&&p.publishStatus==='published'?location.origin+'/s/'+slug:''})};

function openInfo(type){const content=type==='pricing'?'<h2 id="modal-title">Pricing</h2><p>Building and previewing your invitation is free. You pay once, when you publish, and the price depends on the design you choose and where you are. There is no subscription.</p><p class="muted">Publishing is free during early access. The prices that will apply are on the home page, and the price is always shown before you pay.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Got it</button></div>':'<h2 id="modal-title">Privacy & how your draft works</h2><p>Your draft is saved automatically. When online saving is available, a copy is stored privately online and this browser keeps a backup so you can continue here.</p><p>Your private edit link is the key to your draft. Anyone who has it can edit the draft, so keep it safe. Clearing this browser’s data removes only the same-device shortcut.</p><p>Publishing and guest RSVP collection are not connected to a backend yet. Do not use this prototype to collect real guest information or sensitive details.</p><p class="muted">Published pages and RSVP handling need a further security and privacy review before launch.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Understood</button></div>';state.modal={type:'info'};renderModal(content)}
let lastAnimatedPage=null;
function go(page){if(state.page===page){render();return}state.page=page;render()}
// The preview shows the invitation at the chosen device's real width (phone 390, tablet 768, desktop 1280). On a screen narrower than that
// it is scaled down to fit, so Tablet and Desktop look different from Mobile even on a phone.
// Shrinks the Desktop / Tablet preview to fit a phone. It scales with a transform, NOT the CSS zoom property: the designs size
// themselves with container query units and breakpoints, and iPhone Safari measures a zoomed container at its shrunken width,
// so it showed the phone layout with oversized text. With a transform the design is laid out at its real width (1280 or 768
// pixels) in every browser, and the finished picture is scaled down.
let previewFitObserver=null;
function fitPreviewFrame(){
 const f=document.getElementById('preview-frame');
 if(previewFitObserver){previewFitObserver.disconnect();previewFitObserver=null}
 if(!f||!f.parentElement)return;
 const box=f.parentElement,w=Number(f.dataset.w)||390;
 f.style.zoom='';
 const apply=()=>{
  const avail=box.clientWidth,k=avail&&avail<w?avail/w:1;
  if(k<1){f.style.transformOrigin='0 0';f.style.transform='scale('+k+')';f.style.margin='0';f.style.marginBottom=(-(f.offsetHeight*(1-k)))+'px';box.style.overflow='hidden'}
  else{f.style.transform='';f.style.transformOrigin='';f.style.margin='auto';f.style.marginBottom='';box.style.overflow=''}
 };
 apply();
 // The design grows and shrinks (images, openings, reveals): keep the room it takes in step with its real height.
 if(window.ResizeObserver){previewFitObserver=new ResizeObserver(apply);previewFitObserver.observe(f)}
}
window.addEventListener('resize',fitPreviewFrame);
function render(){
 const app=document.getElementById('app');
 const page=state.page;
 if(typeof unmountInviteStudioIsland==='function')unmountInviteStudioIsland();
 const island=typeof inviteStudioIslandRoute==='function'?inviteStudioIslandRoute():null;
 app.innerHTML=island?'<div class="figma-island-host"></div>':page==='public'?publicPageHtml():page==='home'?home():page==='templates'?templatesPage():page==='setup'?setupPage():page==='dashboard'?dashboard():page==='preview'?previewPage():home();
 if(typeof syncMyInvitationsUrl==='function')syncMyInvitationsUrl();
 const template=tpl(state.selectedTemplate);
 const themeText=[state.category||'',state.selectedTemplate||'',template?.name||'',template?.style||''].join(' ').toLowerCase();
 let theme='luxury';
 if(/floral|flower|bloom|botanical/.test(themeText))theme='floral';
 else if(/birthday|celebration|party|event/.test(themeText))theme='celebration';
 else if(/destination|nature|garden|coastal/.test(themeText))theme='nature';
 else if(/editorial|minimal|modern|type/.test(themeText))theme='editorial';
 document.documentElement.dataset.pageTheme=theme;
 if(island&&typeof mountInviteStudioIsland==='function')mountInviteStudioIsland(island);
 if(page==='preview')fitPreviewFrame();
 const previousPage=lastAnimatedPage;
 const motionAllowed=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const transitionClasses=['page-enter','page-enter-floral','page-enter-celebration','page-enter-nature','page-enter-editorial','page-enter-from-home'];
 app.classList.remove(...transitionClasses);
 if(previousPage!==null&&previousPage!==page&&motionAllowed){
   // Animate the entire destination view so every route—including home-to-editor,
   // home-to-template catalogue and home-to-projects—gets the same polished handoff.
   app.classList.add('page-enter','page-enter-'+theme);
   if(previousPage==='home')app.classList.add('page-enter-from-home');
   app.addEventListener('animationend',()=>app.classList.remove(...transitionClasses),{once:true});
 }
 lastAnimatedPage=page;
 window.scrollTo({top:0,behavior:'instant'});
}
bootInviteStudioCloud();
