/* QA hardening: responsive, focus, empty/error states */

img{max-width:100%}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* InviteStudio design pass: editorial hero, device mockups, and compact feature strip */
.hero{grid-template-columns:.92fr 1.08fr;gap:38px;padding-top:46px;padding-bottom:30px}
.hero h1{max-width:590px;font-size:clamp(40px,4.7vw,62px);line-height:1.06;letter-spacing:-2px}
.hero h1 em{font-style:normal;color:#8d6a43}
.hero-art{height:390px;background:#e9e0d3;border:1px solid #e4d9ca;overflow:visible;box-shadow:0 18px 48px #4a382012}
.hero-art>img{border-radius:18px;object-fit:cover}
.hero-art:after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(90deg,#f7f0e522,transparent 60%);pointer-events:none}
.art-label{z-index:2;left:7%;right:7%;bottom:7%;padding:12px 16px;background:#fffdf7f2}
.device-phone{position:absolute;z-index:3;right:3%;bottom:5%;width:105px;height:190px;border:5px solid #292824;border-radius:20px;background:#fffdf7;box-shadow:0 12px 28px #251c1533;overflow:hidden;padding:5px}
.device-phone img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.device-phone:before{content:"";position:absolute;top:5px;left:32%;right:32%;height:8px;border-radius:0 0 8px 8px;background:#292824;z-index:2}
.hero-note{margin-top:22px}
.home-categories{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.home-categories .category{padding:15px 6px;border-radius:11px}
.home-categories .category .emoji{font-size:22px;margin-bottom:9px;color:#8d6a43}
.home-categories .category strong{font-size:11px}
.benefit-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 42px;padding:18px 20px;background:#eee8dd;border:1px solid #e4dbce;border-radius:13px}
.benefit-item{display:flex;gap:10px;align-items:center;min-width:0}
.benefit-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:1px solid #d9c8b2;border-radius:50%;color:#8d6a43;background:#fffaf3;font-size:16px}
.benefit-item strong{display:block;font-size:11px;font-weight:700}
.benefit-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.4}
.home-template-section{padding-top:20px}
.template-card{border-radius:10px}
.template-thumb{height:205px}
.template-info h3{font-size:17px}
.template-info{padding:12px}
@media(max-width:900px){
 .home-categories{grid-template-columns:repeat(4,minmax(0,1fr))}
 .benefit-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero-art{height:350px}
}
@media(max-width:640px){
 .hero{padding-top:30px;gap:20px}
 .hero h1{font-size:clamp(36px,10vw,45px);letter-spacing:-1.4px}
 .hero-art{height:280px;overflow:hidden;border-radius:15px}
 .device-phone{width:77px;height:142px;border-width:4px;right:3%;bottom:17%}
 .art-label{left:5%;right:18%;bottom:5%;padding:10px}
 .art-label strong{font-size:16px}
 .home-categories{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
 .home-categories .category{padding:12px 4px}
 .home-categories .category strong{font-size:10px}
 .benefit-strip{gap:12px;padding:14px;margin-bottom:25px}
 .benefit-item{align-items:flex-start;gap:7px}
 .benefit-icon{width:29px;height:29px;flex-basis:29px;font-size:13px}
 .benefit-item strong{font-size:10px}
 .benefit-item small{font-size:9px}
 .template-thumb{height:155px}
}


/* Template detail modal follows the approved split-preview composition */
.template-detail-shell{width:min(900px,96vw);padding:0;overflow:hidden}.template-detail-modal{width:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr)}
.template-detail-art{min-height:480px;background:#e9e0d3;position:relative;overflow:hidden}
.template-detail-art img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.template-detail-copy{padding:30px;display:flex;flex-direction:column;justify-content:center}
.template-detail-copy h2{margin:12px 0;font-size:34px}
.template-detail-swatches{display:flex;gap:8px;margin:20px 0}
.template-detail-swatches i{display:block;width:24px;height:24px;border-radius:50%;border:1px solid #0001}

.template-detail-benefits span:before{content:"✓";display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#e8eee3;color:#597050;margin-right:9px;font-weight:700}

/* Luxury redesign */

body{background:var(--paper);letter-spacing:.005em}.topbar{background:#faf7f0ef;backdrop-filter:blur(16px);border-bottom-color:#e6ded1}
.brand{font-size:26px;letter-spacing:-1px}.brand span{color:#a88754}.btn{border-radius:3px;padding:12px 18px;font-size:12px}.btn.dark{background:#292923;border-color:#292923}.btn.dark:hover{background:#464238}
.hero{padding-top:62px;padding-bottom:44px;gap:5vw}.hero h1{font-size:clamp(44px,5vw,70px);line-height:1.04;letter-spacing:-2.4px;font-weight:400}.hero p{line-height:1.9;font-size:15px}
.hero-art{border-radius:2px;box-shadow:0 24px 55px #44351f14}.hero-art>img{border-radius:2px}.art-label{border-radius:2px;box-shadow:0 10px 35px #211b1217}
.section-head h2,.panel h2,.page-title h1{font-weight:400}.section-head h2{font-size:35px}.category{border-radius:2px;background:#fcfaf5;border-color:#e6ddcf;min-height:112px}
.category:hover,.category.selected{border-color:#a98958;box-shadow:0 8px 22px #6c4a1710}.template-grid{gap:22px}.template-card{border-radius:2px;background:#fffdf8;border-color:#e6ddcf}
.template-thumb{height:235px;background:#e8dfd1}.template-thumb img{filter:saturate(.88)}.tag{border-radius:1px;letter-spacing:1px;text-transform:uppercase;font-size:9px;background:#fffdf2ed}
.template-info{padding:17px}.template-info h3{font-size:21px;font-weight:400}.template-info p{line-height:1.6}.template-info .btn{border-radius:2px}
.benefit-strip,.how{border-radius:2px;background:#ebe5da;border-color:#e0d5c4}.step-number{border-radius:2px;background:#a88754}.panel{border-radius:2px;box-shadow:0 14px 35px #35281708}
.field input,.field select,.field textarea,.search{border-radius:2px;background:#fffdf8}.pill{border-radius:2px}.pill.active{background:#292923;border-color:#292923}
.project-card{border-radius:2px}.project-cover{height:210px}.project-body h3{font-weight:400}.modal{border-radius:2px}.template-detail-shell{border-radius:2px}
.preference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.preference-choice{border:1px solid var(--line);padding:14px;background:#fffdf8}
.preference-choice label{display:block;font-size:11px;font-weight:700;margin-bottom:9px}
.preference-choice select{width:100%;border:1px solid var(--line);padding:11px;background:#fff;border-radius:2px;color:var(--ink)}
.choice-note{padding:13px 15px;background:#eee8dc;color:#6d665b;font-size:11px;line-height:1.7;margin-top:16px}
@media(max-width:640px){.preference-grid{grid-template-columns:1fr}}
.occasion-catalogue{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 34px}
.occasion-tile{position:relative;min-height:150px;overflow:hidden;border:1px solid #e0d6c7;background:#e6dfd3;text-align:left;padding:0;color:#fff;isolation:isolate}
.occasion-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s;filter:saturate(.78)}
.occasion-tile:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#191812c9,#1918120b 80%);z-index:-1}
.occasion-tile:hover img{transform:scale(1.05)}.occasion-tile-copy{position:absolute;left:16px;right:12px;bottom:14px}
.occasion-tile-copy strong{display:block;font:400 21px var(--serif);line-height:1.2}.occasion-tile-copy small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:7px;color:#f2e7d5}
@media(max-width:900px){.occasion-catalogue{grid-template-columns:repeat(3,minmax(0,1fr))}.template-grid{gap:14px}}
@media(max-width:640px){.hero{padding-top:34px}.hero h1{font-weight:400}.template-grid{gap:10px}.template-thumb{height:175px}.template-info{padding:12px}.occasion-catalogue{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.occasion-tile{min-height:130px}.occasion-tile-copy{left:11px;bottom:11px}.occasion-tile-copy strong{font-size:18px}}


/* Editorial luxury homepage */

oupForTemplate(t)===state.category).map(t=>t.style).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}" ${state.filter===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>Colour<select id="palette-filter" onchange="state.palette=this.value;renderTemplatesOnly()"><option value="All">All palettes</option>${['Warm & Gold','Blush & Rose','Botanical & Green','Midnight & Jewel','Pastel & Playful','Ivory & Neutral'].map(x=>`<option value="${x}" ${state.palette===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Search<input placeholder="Search designs…" value="${esc(state.search)}" oninput="state.search=this.value;renderTemplatesOnly()"></label></div><div class="template-grid" id="template-grid">${visible.map(templateCard).join('')||'<div class="empty" style="grid-column:1/-1">No templates in this collection yet.</div>'}</div></div></main>${footer()}`}

function paletteFor(t){const text=(t.id+' '+t.name+' '+(t.tradition||'')+' '+(t.occasion||'')).toLowerCase();if(/haldi|saffron|ganesh|tilak|gold|reception|chandelier|kasavu|temple|baraat|phera/.test(text))return 'Warm & Gold';if(/rose|blush|vidaai|bridal|roka|pink|chooda/.test(text))return 'Blush & Rose';if(/mehendi|emerald|botanical|garden|mogra|jasmine|kerala|vines|reunion/.test(text))return 'Botanical & Green';if(/midnight|noor|muslim|sangeet|velvet|cosmic|cathedral|royal/.test(text))return 'Midnight & Jewel';if(/birthday|baby|little|first|cloud|baptism|dove/.test(text))return 'Pastel & Playful';return 'Ivory & Neutral'}

function setupContent(){const p=current()||{};if(state.setupStep===0)return `<h2>Let’s make it yours.</h2><p class="intro">Add the basics to see your invitation come to life. Everything else can wait.</p><div class="form-grid"><div class="field"><label>What are you celebrating?</label><select id="eventCategory" onchange="state.category=this.value;const match=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(match)state.selectedTemplate=match.id">${categories.map(([n])=>`<option ${state.category===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Couple or celebration names</label><input id="projectTitle" placeholder="e.g. Meera & Arjun" value="${esc(p.title||'')}"></div><div class="field"><label>Event date</label><input type="date" id="projectDate" value="${esc(p.date||'')}"></div><div class="field"><label>Main location <span class="muted">(optional)</span></label><input id="projectLocation" placeholder="City or venue" value="${esc(p.location||'')}"></div><div class="field full"><label>A short welcome message <span class="muted">(optional)</span></label><textarea id="projectMessage" placeholder="A few words for your guests…">${esc(p.message||'')}</textarea></div></div>`;if(state.setupStep===1)return `<h2>Tell your story.</h2><p class="intro">A few words can make the invitation feel personal. This step is entirely optional.</p><div class="form-grid"><div class="field full"><label>Your introduction</label><textarea id="projectStory" style="min-height:150px" placeholder="Share a little about the people or occasion…">${esc(p.story||'')}</textarea><small>Write as much or as little as you like.</small></div><div class="field"><label>Names or hosts <span class="muted">(optional)</span></label><input id="projectHosts" value="${esc(p.hosts||'')}" placeholder="Names to display"></div><div class="field"><label>Website language</label><select id="projectLocale">${['English','Malayalam','Tamil','Hindi','Other'].map(locale=>`<option ${((p.locale||'English')===locale)?'selected':''}>${locale}</option>`).join('')}</select></div></div>`;if(state.setupStep===2)return `<h2>What happens on the day?</h2><p class="intro">Choose common functions below or add your own. You can edit every detail later.</p>${functionPresetPicker(p)}${functionRows(p)}<button class="btn" onclick="addFunction()">＋ Add custom function</button><p class="tiny muted" style="margin-top:12px">Dates, times and venues are optional while you're drafting.</p>`;return `<h2>Curate your experience.</h2><p class="intro">Choose a design and visual style independently from any cultural preferences. You can skip the cultural step entirely.</p><div class="culture-preferences"><h3>Would you like to personalise your invitation with religious or cultural elements?</h3><p>Optional. Your choice will not automatically change your design, colours, fonts, or animations.</p><div class="field"><label for="cultureTradition">Religious or cultural preference</label><select id="cultureTradition"><option value="none" ${(p.culturalPreferences?.tradition||'none')==='none'?'selected':''}>No specific religious or cultural elements</option>${['Christian','Hindu','Muslim','Sikh','Buddhist','Jain','Jewish','Interfaith','Other tradition','Custom preferences'].map(x=>`<option ${p.culturalPreferences?.tradition===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="cultureRegion">Regional or event structure (optional)</label><select id="cultureRegion"><option value="">No regional structure</option>${Object.keys(weddingRegionalPresets).map(x=>`<option ${p.culturalPreferences?.region===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Elements you explicitly want (optional)</label><div class="culture-element-grid">${[['symbols','Religious symbols or motifs'],['blessing','Scripture, prayers or blessings'],['wording','Ceremony-specific wording'],['patterns','Cultural decorati const weddingRegionalPresets={'North Indian wedding':['Roka / Engagement','Haldi','Mehendi','Sangeet','Wedding Ceremony','Reception'],'South Indian wedding':['Pre-wedding gathering','Wedding Ceremony','Blessing Ceremony','Reception'],'Kerala wedding':['Pre-wedding gathering','Wedding Ceremony','Reception','Family celebration'],'Other regional tradition':['Traditional ceremony','Family gathering','Reception'],'Fusion or multicultural wedding':['Welcome gathering','Ceremony one','Ceremony two','Shared celebration'],'Custom event structure':['Welcome gathering','Ceremony','Reception']};
function functionPresetPicker(p){const prefs=p.culturalPreferences||{};const presets=p.category==='Wedding'?(prefs.region&&weddingRegionalPresets[prefs.region]?weddingRegionalPresets[prefs.region]:['Welcome gathering','Wedding ceremony','Reception','Dinner & celebration']):(functionPresets[p.category]||functionPresets.Wedding);const added=new Set((p.functions||[]).map(f=>f.title.toLowerCase()));return `<div class="function-preset-picker"><div class="preset-picker-heading"><strong>Quick-add ${esc(p.category==='Wedding'?'wedding functions':'event moments')}</strong><small>Tap any option to add it to your schedule.</small></div><div class="function-preset-chips">${presets.map(title=>`<button type="button" class="function-preset-chip ${added.has(title.toLowerCase())?'is-added':''}" onclick="addFunctionPreset('${title}')" ${added.has(title.toLowerCase())?'aria-label="'+esc(title)+' already added"':''}>${added.has(title.toLowerCase())?'✓ ':'+ '}${esc(title)}</button>`).join('')}</div></div>`}
function functionRows(p){return (p.functions||[]).map((f,i)=>`<div class="list-row"><div style="font-size:18px;color:#ad895c">✳</div><div class="row-content"><strong>${esc(f.title)}</strong><small>${esc(f.date||'Date not set')}${f.time?' · '+esc(f.time):''} · ${esc(f.venue||'Venue not set')}</small><small>${f.visible===false?'Hidden from guests':'Visible to guests'}</small></div><div class="row-buttons"><button class="icon-btn" title="Move up" aria-label="Move '+esc(f.title)+' up" onclick="moveFunction('${f.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="icon-btn" title="Move down" aria-label="Move '+esc(f.title)+' down" onclick="moveFunction('${f.id}',1)" ${i===p.functions.length-1?'disabled':''}>↓</button><button class="icon-btn" title="Toggle visibility" aria-label="Toggle visibility for ${esc(f.title)}" onclick="toggleFunction('${f.id}')">${f.visible===false?'◉':'◌'}</button><button class="icon-btn" title="Edit" aria-label="Edit ${esc(f.title)}" onclick="editFunction('${f.id}')">✎</button><button class="icon-btn" title="Duplicate" aria-label="Duplicate ${esc(f.title)}" onclick="duplicateFunction('${f.id}')">▣</button><button class="icon-btn" title="Remove" aria-label="Remove ${esc(f.title)}" onclick="removeFunction('${f.id}')">×</button></div></div>`).join('')||'<div class="empty">No functions added yet. You can add them later.</div>'}
function ensureProject(){let p=current();if(!p){p={id:crypto.randomUUID(),name:'Untitled event',category:state.category,templateId:state.selectedTemplate,status:'Draft',updated:'Just now',title:'',date:'',location:'',message:'',story:'',functions:[],theme:{background:'#f4eee4',accent:'#a77d4d',text:'#28241f'},published:false};state.projects.unshift(p);state.currentId=p.id}return p}
function applyPreferences(p){if(!p)return;const palette=p.preferences?.palette||'champagne';const palettes={champagne:{background:'#f4eee4',accent:'#a88754',text:'#28241f'},sage:{background:'#edf0e7',accent:'#7d8b70',text:'#2b3028'},blush:{background:'#f5e8e5',accent:'#b47e83',text:'#382b2c'},noir:{background:'#272723',accent:'#c6a56b',text:'#f7f0e4'},blue:{background:'#e9eef2',accent:'#819bad',text:'#26313a'},earth:{background:'#eee3d6',accent:'#ad6f4f',text:'#342a24'}};const chosen=palettes[palette];if(chosen){p.theme={...(p.theme||{}),...chosen};}if(document.getElementById('accentColor'))p.theme.accent=document.getElementById('accentColor').value;if(p.preferences?.rsvp==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='rsvp');if(section)section.visible=false;}if(p.preferences?.gallery==='none'){p.sections=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}if(p.preferences?.gallery==='hero'&&p.sections){const section=p.sections.find(x=>x.id==='gallery');if(section)section.visible=false;}}
function setSetupStep(delta){if(!saveSetupFields())return;if(state.setupStep===3&&delta>0){const p=ensureProject();if(!String(p.title||'').trim())p.title=p.category==='Wedding'?'Our wedding':'Our celebration';p.templateId=state.selectedTemplate;p.category=state.category;applyPreferences(p);p.name=p.title||p.name;p.updated='Just now';save();state.page='editor';render();return}state.setupStep=Math.max(0,Math.min(3,state.setupStep+delta));render()}
function saveSetupFields(){let p=current();if(!p&&state.setupStep===0){p=ensureProject()}if(!p)return true;const v=id=>document.getElementById(id)?.value;const previousCategory=p.category;if(v('eventCategory')){state.category=v('eventCategory');p.category=state.category;if(previousCategory!==state.category){const compatible=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(compatible)state.selectedTemplate=compatible.id;}}if(v('projectTitle')!==undefined)p.title=v('projectTitle');if(v('projectDate')!==undefined)p.date=v('projectDate');if(v('projectLocation')!==undefined)p.location=v('projectLocation');if(v('projectMessage')!==undefined)p.message=v('projectMessage');if(v('projectStory')!==undefined)p.story=v('projectStory');if(v('projectHosts')!==undefined)p.hosts=v('projectHosts');if(v('projectLocale')!==undefined)p.locale=v('projectLocale');const prefValues={mood:v('prefMood'),palette:v('prefPalette'),typography:v('prefTypography'),layout:v('prefLayout'),rsvp:v('prefRsvp'),gallery:v('prefGallery')};if(p.category==='Wedding'&&v('cultureTradition')!==undefined){p.culturalPreferences={...(p.culturalPreferences||{}),tradition:v('cultureTradition'),region:v('cultureRegion')||'',elements:[...document.querySelectorAll('input[name="cultureElements"]:checked')].map(x=>x.value),customText:v('cultureCustom')||''};}p.preferences={...(p.preferences||{})};Object.entries(prefValues).forEach(([key,value])=>{if(value!==undefined)p.preferences[key]=value});p.name=p.title||p.name;p.category=state.category;p.templateId=state.selectedTemplate;return save()}
function addFunction(){saveSetupFields();const p=ensureProject();p.functions.push({id:crypto.randomUUID(),title:'New function',date:'',time:'',venue:'',visible:true});save();render();editFunction(p.functions[p.functions.length-1].id)}function editFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!f)return;state.modal={type:'function',id};renderModal(`<h2 id="modal-title">Edit function</h2><p class="muted">Use any title that fits your event. All fields except the title are optional.</p><div class="form-grid"><div class="field full"><label for="fnTitle">Function name</label><input id="fnTitle" value="${esc(f.title)}" placeholder="e.g. Wedding Ceremony" required></div><div class="field"><label for="fnDate">Date</label><input type="date" id="fnDate" value="${esc(f.date||'')}"></div><div class="field"><label for="fnTime">Start time</label><input type="time" id="fnTime" value="${esc(f.time||'')}"></div><div class="field"><label for="fnEndTime">End time</label><input type="time" id="fnEndTime" value="${esc(f.endTime||'')}"></div><div class="field"><label for="fnDress">Dress code</label><input id="fnDress" value="${esc(f.dressCode||'')}"></div><div class="field full"><label for="fnVenue">Venue</label><input id="fnVenue" value="${esc(f.venue||'')}" placeholder="Venue name or address"></div><div class="field full"><label for="fnDirections">Directions link</label><input id="fnDirections" type="url" value="${esc(f.directionsUrl||'')}" placeholder="https://…"></div><details class="field full logistics-details"><summary>More guest information <span class="muted">(optional)</span></summary><div class="field full"><label for="fnParking">Parking information</label><textarea id="fnParking" placeholder="Parking, drop-off or access details">${esc(f.parking||'')}</textarea></div><div class="field full"><label for="fnAccommodation">Accommodation and travel</label><textarea id="fnAccommodation" placeholder="Nearby hotels or transport tips">${esc(f.accommodation||'')}</textarea></div><div class="field full"><label for="fnAccessibility">Accessibility information</label><textarea id="fnAccessibility" placeholder="Step-free access, seating or access needs">${esc(f.accessibility||'')}</textarea></div></details><div class="field full"><label for="fnDescription">Description or guest notes</label><textarea id="fnDescription">${esc(f.description||'')}</textarea></div><div class="field full"><label><input id="fnVisible" type="checkbox" ${f.visible===false?'':'checked'} style="width:auto"> Show this function on the invitation</label></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="saveFunction('${id}')">Save function</button></div>`)}function saveFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const title=document.getElementById('fnTitle').value.trim();if(!title){document.getElementById('fnTitle').setCustomValidity('Please enter a function name.');document.getElementById('fnTitle').reportValidity();return}f.title=title;f.date=document.getElementById('fnDate').value;f.time=document.getElementById('fnTime').value;f.endTime=document.getElementById('fnEndTime').value;f.venue=document.getElementById('fnVenue').value.trim();f.directionsUrl=document.getElementById('fnDirections').value.trim();f.description=document.getElementById('fnDescription').value.trim();f.dressCode=document.getElementById('fnDress').value.trim();f.parking=document.getElementById('fnParking')?.value.trim()||'';f.accommodation=document.getElementById('fnAccommodation')?.value.trim()||'';f.accessibility=document.getElementById('fnAccessibility')?.value.trim()||'';const start=f.time,end=f.endTime;const endField=document.getElementById('fnEndTime');endField.setCustomValidity('');if(start&&end&&end<start){endField.setCustomValidity('End time must be after the start time.');endField.reportValidity();return}f.visible=document.getElementById('fnVisible').checked;if(!save())return;closeModal();render();toast('Function saved locally')}function removeFunction(id){const p=current();if(!p)return;const f=p.functions.find(x=>x.id===id);if(!f||!confirm(`Remove “${f.title}” from this draft? This cannot be undone in the prototype.`))return;p.functions=p.functions.filter(x=>x.id!==id);save();render();toast('Function removed')}function moveFunction(id,delta){const p=current();if(!p)return;const i=p.functions.findIndex(f=>f.id===id),j=i+delta;if(i<0||j<0||j>=p.functions.length)return;[p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]];if(save())render();else [p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]]}function toggleFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const previous=f.visible;f.visible=f.visible===false;if(save())render();else f.visible=previous}function duplicateFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!p||!f)return;const copy={...f,id:crypto.randomUUID(),title:f.title+' (copy)'};p.functions.splice(p.functions.indexOf(f)+1,0,copy);save();render();toast('Function duplicated')}

function addCustomSection(){const p=current();if(!p)return;p.sections=p.sections||[{id:'hero',title:'Hero',visible:true},{id:'welcome',title:'Welcome message',visible:true},{id:'story',title:'Our story',visible:true},{id:'functions',title:'Events / Functions',visible:true},{id:'gallery',title:'Gallery',visible:true},{id:'rsvp',title:'RSVP',visible:true}];const sec={id:crypto.randomUUID(),title:'New section',content:'Add your message here.',visible:true,custom:true};p.sections.push(sec);state.activeSection=sec.id;save();render()}function updateCustomSection(id,key,value){const sec=current()?.sections?.find(x=>x.id===id&&x.custom);if(!sec)return;sec[key]=value;save();refreshPreview()}function removeCustomSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id&&x.custom);if(!p||!sec||!confirm(`Remove “${sec.title}” from this draft?`))return;p.sections=p.sections.filter(x=>x.id!==id);state.activeSection='Sections';save();render()}function openSection(id){const map={hero:'Content',welcome:'Content',story:'Content',functions:'Events / Functions',gallery:'Photos',rsvp:'Settings'};state.activeSection=id;state.editorTab=map[id]||(current()?.sections?.find(x=>x.id===id)?.custom?'Sections':'Content');render()}function moveSection(id,delta){const p=current();if(!p)return;const a=p.sections||[],i=a.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(save())render();else [a[i],a[j]]=[a[j],a[i]]}function toggleSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id);if(!sec)return;const previous=sec.visible;sec.visible=!sec.visible;if(save()){render();refreshPreview()}else sec.visible=previous}function updateProject(key,value){const p=current();if(!p)return;p[key]=value;if(key==='title')p.name=value||'Untitled event';if(key==='category'){state.category=value;const compatible=templates.find(t=>t.category===value||t.category===categoryAlias(value));if(compatible){p.templateId=compatible.id;state.selectedTemplate=compatible.id}}p.updated='Just now';if(save())refreshPreview()}function handlePhotoUpload(files){const p=current();if(!p)return;const previous=p.photos||[];const remaining=Math.max(0,4-previous.length);if(!remaining){toast('Photo limit reached. Remove a photo before adding another.');return}if(files.length>remaining)toast(`Only ${remaining} photo slot(s) remain; extra files will be ignored.`);const selected=[...files].slice(0,remaining);Promise.all(selected.map(file=>new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')||file.size>1024*1024){reject(new Error(`${file.name}: choose an image under 1 MB.`));return}const reader=new FileReader();reader.onload=()=>resolve({data:reader.result,alt:file.name.replace(/\.[^.]+$/,'')});reader.onerror=()=>reject(new Error('Could not read image.'));reader.readAsDataURL(file)}))).then(items=>{p.photos=[...previous,...items].slice(0,4);if(!save()){p.photos=previous;return}render();toast('Photos added to this browser draft')}).catch(e=>toast(e.message)).finally(()=>{const input=document.getElementById('photoUpload');if(input)input.value=''})}function updatePhotoAlt(i,value){const p=current();if(!p?.photos?.[i])return;p.photos[i].alt=value;save()}function removePhoto(i){const p=current();if(!p?.photos)return;const previous=[...p.photos];p.photos.splice(i,1);if(save())render();else p.photos=previous}function updateAnimation(key,value){const p=current();if(!p)return;p.animationSettings={...(p.animationSettings||{}),[key]:key==='speed'?Number(value):value};if(save())refreshPreview()}function updateTheme(key,value){const p=current();if(!p)return;const previous=p.theme[key];p.theme[key]=value;if(save())refreshPreview();else p.theme[key]=previous}function updateTemplate(id){const p=current();if(!p)return;const previous=p.templateId;p.templateId=id;const t=tpl(id);p.theme={...(p.theme||{}),background:t.colors[0]||'#f4eee4',accent:t.colors[1]||'#a77d4d',text:t.colors[2]||'#28241f'};p.animationSettings={...(p.animationSettings||{}),effect:t.effect||'fade'};if(save())render();else p.templateId=previous}function resetTheme(){const p=current();if(!p)return;const previous={...p.theme};p.theme={background:'#f4eee4',accent:'#a77d4d',text:'#28241f'};if(save())render();else p.theme=previous}
function introSequenceFor(t){const profiles=['cinematic','floral','envelope','monogram','editorial','celebration','nature','type','storybook','light','botanical','spotlight'];const id=t.id||t.name;let h=0,h2=5381;for(let i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))>>>0;h2=((h2<<5)-h2+id.charCodeAt(id.length-1-i))>>>0}const sequence=h2%12;return {profile:t.introProfile||profiles[h%profiles.length],sequence,flourish:['orbit','petals','fold','monogram','paper','confetti','landscape','letters','illustration','light','vine','spotlight'][sequence],duration:5.2+(h2%4)*.45,transition:['dissolve','fold','wipe','soft-zoom'][h%4]}}

function resolvedIntroStyle(p,t){if(p.introSettings?.style&&p.introSettings.style!=='auto')return p.introSettings.style;const id=(t.id||t.name||'').toLowerCase();if(/floral|garden|botanical|jasmine|rose|marigold|vine|lotus/.test(id))return 'floral';if(/envelope|door|palace|royal|frame/.test(id))return 'envelope';if(/mandala|monogram|crest/.test(id))return 'monogram';if(/storybook|illustrat|fairytale/.test(id))return 'storybook';if(/nature|mountain|destination|monsoon|landscape/.test(id))return 'nature';if(/celebration|baraat|sangeet|birthday|confetti/.test(id))return 'celebration';if(/light|spotlight|shimmer|gold/.test(id))return 'light';if(/editorial|paper|ivory|heirloom|classic/.test(id))return 'editorial';if(/modern|minimal|type/.test(id))return 'type';return 'cinematic'}

function previewProject(id){state.currentId=id;state.page='preview';render()}
function previewPage(){const p=current()||ensureProject();return `<header class="topbar"><div class="brand" onclick="go('dashboard')">Invite<span>Studio</span></div><div class="top-actions"><button class="btn" onclick="go('editor')">← Back to editor</button><button class="btn dark" onclick="openPublish()">Publish</button></div></header><main class="container" style="padding:22px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><div><strong>Website preview</strong><div class="tiny muted">This is a preview. Publishing is simulated in this frontend prototype.</div></div><div class="filters" style="margin:0"><button class="pill ${state.device==='desktop'?'active':''}" onclick="state.device='desktop';render()">Desktop</button><button class="pill ${state.device==='tablet'?'active':''}" onclick="state.device='tablet';render()">Tablet</button><button class="pill ${state.device==='mobile'?'active':''}" onclick="state.device='mobile';render()">Mobile</button></div></div><div style="max-width:${state.device==='mobile'?'390px':state.device==='tablet'?'768px':'100%'};margin:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white">${sitePreview(p,tpl(p.templateId),true)}</div></main>`}
function openPublish(){const p=current();if(!p)return;state.modal={type:'publish'};renderModal(`<div class="eyebrow">Your invitation draft</div><h2>Your preview is ready.</h2><p class="muted">You can keep personalising your invitation here. This draft is saved only in this browser on this device.</p><div style="background:#f2eee6;padding:14px;border-radius:9px;margin-top:15px;font-size:12px;line-height:1.6">✓ Preview available<br>✓ Draft saved on this device<br>○ Live website not available yet</div><div role="status" class="publish-unavailable"><strong>You can’t publish a live website yet.</strong><p>InviteStudio’s publishing service isn’t connected. This preview is not a public link, and guests can’t submit real RSVPs yet.</p></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Continue editing</button><button class="btn dark" onclick="viewInvitationPreview()">View my preview</button></div>`)}function viewInvitationPreview(){closeModal();state.page="preview";state.device="mobile";render()}function simulatePublish(){toast('Publishing is not available yet. Your draft remains saved on this device.');closeModal()}
function renderModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${content.includes('template-detail-modal')?'template-detail-shell':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`;const dlg=document.querySelector('[role=dialog]');dlg?.focus();dlg?.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...dlg.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})}function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}
function createQuickPreview(){if(!saveSetupFields())return;const p=ensureProject();if(!String(p.title||'').trim())p.title=p.category==='Wedding'?'Our wedding':'Our celebration';p.name=p.title;p.category=state.category;p.templateId=state.selectedTemplate||p.templateId;applyPreferences(p);p.updated='Just now';if(!save())return;state.page='editor';state.mobileEditorView='preview';render();toast('Your first preview is ready — add details whenever you like')}function skipSetupStep(){if(!saveSetupFields())return;state.setupStep=3;render();toast('Optional details skipped — you can add them later in the editor')}
function openInfo(type){const content=type==='pricing'?'<h2 id="modal-title">Pricing</h2><p>InviteStudio is currently a frontend prototype. No paid plans or charges are available in this demo.</p><p class="muted">Plan limits and costs will be shown clearly before any payment feature is introduced.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Got it</button></div>':'<h2 id="modal-title">Privacy & how your draft works</h2><p>Your draft is stored in this browser on this device. It is not synced to an account or another device, and clearing browser data may remove it.</p><p>Publishing and guest RSVP collection are not connected to a backend yet. Do not use this prototype to collect real guest information or sensitive details.</p><p class="muted">Cloud saving, account access, published pages and RSVP handling need appropriate security and privacy controls.</p><div class="modal-actions"><button class="btn dark" onclick="closeModal()">Understood</button></div>';state.modal={type:'info'};renderModal(content)}
function go(page){state.page=page;render()}function render(){document.getElementById('app').innerHTML=state.page==='home'?home():state.page==='templates'?templatesPage():state.page==='setup'?setupPage():state.page==='editor'?editor():state.page==='dashboard'?dashboard():state.page==='preview'?previewPage():home();window.scrollTo({top:0,behavior:'instant'})}
load();render();
</script></body></html>
