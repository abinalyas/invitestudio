/* QA hardening: responsive, focus, empty/error states */

img{max-width:100%}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* InviteStudio design pass: editorial hero, device mockups, and compact feature strip */
.hero{grid-template-columns:.92fr 1.08fr;gap:38px;padding-top:46px;padding-bottom:30px}
.hero h1{max-width:590px;font-size:clamp(40px,4.7vw,62px);line-height:1.06;letter-spacing:-2px}
.hero h1 em{font-style:normal;color:#8d6a43}
.hero-art{height:390px;background:#e9e0d3;border:1px solid #e4d9ca;overflow:visible;box-shadow:0 18px 48px #4a382012}
.hero-art>img{border-radius:18px;object-fit:cover}
.hero-art:after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(90deg,#f7f0e522,transparent 60%);pointer-events:none}
.art-label{z-index:2;left:7%;right:7%;bottom:7%;padding:12px 16px;background:#fffdf7f2}
.device-phone{position:absolute;z-index:3;right:3%;bottom:5%;width:105px;height:190px;border:5px solid #292824;border-radius:20px;background:#fffdf7;box-shadow:0 12px 28px #251c1533;overflow:hidden;padding:5px}
.device-phone img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.device-phone:before{content:"";position:absolute;top:5px;left:32%;right:32%;height:8px;border-radius:0 0 8px 8px;background:#292824;z-index:2}
.hero-note{margin-top:22px}
.home-categories{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.home-categories .category{padding:15px 6px;border-radius:11px}
.home-categories .category .emoji{font-size:22px;margin-bottom:9px;color:#8d6a43}
.home-categories .category strong{font-size:11px}
.benefit-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 42px;padding:18px 20px;background:#eee8dd;border:1px solid #e4dbce;border-radius:13px}
.benefit-item{display:flex;gap:10px;align-items:center;min-width:0}
.benefit-icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:1px solid #d9c8b2;border-radius:50%;color:#8d6a43;background:#fffaf3;font-size:16px}
.benefit-item strong{display:block;font-size:11px;font-weight:700}
.benefit-item small{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.4}
.home-template-section{padding-top:20px}
.template-card{border-radius:10px}
.template-thumb{height:205px}
.template-info h3{font-size:17px}
.template-info{padding:12px}
@media(max-width:900px){
 .home-categories{grid-template-columns:repeat(4,minmax(0,1fr))}
 .benefit-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero-art{height:350px}
}
@media(max-width:640px){
 .hero{padding-top:30px;gap:20px}
 .hero h1{font-size:clamp(36px,10vw,45px);letter-spacing:-1.4px}
 .hero-art{height:280px;overflow:hidden;border-radius:15px}
 .device-phone{width:77px;height:142px;border-width:4px;right:3%;bottom:17%}
 .art-label{left:5%;right:18%;bottom:5%;padding:10px}
 .art-label strong{font-size:16px}
 .home-categories{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
 .home-categories .category{padding:12px 4px}
 .home-categories .category strong{font-size:10px}
 .benefit-strip{gap:12px;padding:14px;margin-bottom:25px}
 .benefit-item{align-items:flex-start;gap:7px}
 .benefit-icon{width:29px;height:29px;flex-basis:29px;font-size:13px}
 .benefit-item strong{font-size:10px}
 .benefit-item small{font-size:9px}
 .template-thumb{height:155px}
}


/* Template detail modal follows the approved split-preview composition */
.template-detail-shell{width:min(900px,96vw);padding:0;overflow:hidden}.template-detail-modal{width:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(280px,.88fr)}
.template-detail-art{min-height:480px;background:#e9e0d3;position:relative;overflow:hidden}
.template-detail-art img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.template-detail-copy{padding:30px;display:flex;flex-direction:column;justify-content:center}
.template-detail-copy h2{margin:12px 0;font-size:34px}
.template-detail-swatches{display:flex;gap:8px;margin:20px 0}
.template-detail-swatches i{display:block;width:24px;height:24px;border-radius:50%;border:1px solid #0001}

.template-detail-benefits span:before{content:"✓";display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#e8eee3;color:#597050;margin-right:9px;font-weight:700}

/* Luxury redesign */

body{background:var(--paper);letter-spacing:.005em}.topbar{background:#faf7f0ef;backdrop-filter:blur(16px);border-bottom-color:#e6ded1}
.brand{font-size:26px;letter-spacing:-1px}.brand span{color:#a88754}.btn{border-radius:3px;padding:12px 18px;font-size:12px}.btn.dark{background:#292923;border-color:#292923}.btn.dark:hover{background:#464238}
.hero{padding-top:62px;padding-bottom:44px;gap:5vw}.hero h1{font-size:clamp(44px,5vw,70px);line-height:1.04;letter-spacing:-2.4px;font-weight:400}.hero p{line-height:1.9;font-size:15px}
.hero-art{border-radius:2px;box-shadow:0 24px 55px #44351f14}.hero-art>img{border-radius:2px}.art-label{border-radius:2px;box-shadow:0 10px 35px #211b1217}
.section-head h2,.panel h2,.page-title h1{font-weight:400}.section-head h2{font-size:35px}.category{border-radius:2px;background:#fcfaf5;border-color:#e6ddcf;min-height:112px}
.category:hover,.category.selected{border-color:#a98958;box-shadow:0 8px 22px #6c4a1710}.template-grid{gap:22px}.template-card{border-radius:2px;background:#fffdf8;border-color:#e6ddcf}
.template-thumb{height:235px;background:#e8dfd1}.template-thumb img{filter:saturate(.88)}.tag{border-radius:1px;letter-spacing:1px;text-transform:uppercase;font-size:9px;background:#fffdf2ed}
.template-info{padding:17px}.template-info h3{font-size:21px;font-weight:400}.template-info p{line-height:1.6}.template-info .btn{border-radius:2px}
.benefit-strip,.how{border-radius:2px;background:#ebe5da;border-color:#e0d5c4}.step-number{border-radius:2px;background:#a88754}.panel{border-radius:2px;box-shadow:0 14px 35px #35281708}
.field input,.field select,.field textarea,.search{border-radius:2px;background:#fffdf8}.pill{border-radius:2px}.pill.active{background:#292923;border-color:#292923}
.project-card{border-radius:2px}.project-cover{height:210px}.project-body h3{font-weight:400}.modal{border-radius:2px}.template-detail-shell{border-radius:2px}
.preference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.preference-choice{border:1px solid var(--line);padding:14px;background:#fffdf8}
.preference-choice label{display:block;font-size:11px;font-weight:700;margin-bottom:9px}
.preference-choice select{width:100%;border:1px solid var(--line);padding:11px;background:#fff;border-radius:2px;color:var(--ink)}
.choice-note{padding:13px 15px;background:#eee8dc;color:#6d665b;font-size:11px;line-height:1.7;margin-top:16px}
@media(max-width:640px){.preference-grid{grid-template-columns:1fr}}
.occasion-catalogue{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0 34px}
.occasion-tile{position:relative;min-height:150px;overflow:hidden;border:1px solid #e0d6c7;background:#e6dfd3;text-align:left;padding:0;color:#fff;isolation:isolate}
.occasion-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .5s;filter:saturate(.78)}
.occasion-tile:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#191812c9,#1918120b 80%);z-index:-1}
.occasion-tile:hover img{transform:scale(1.05)}.occasion-tile-copy{position:absolute;left:16px;right:12px;bottom:14px}
.occasion-tile-copy strong{display:block;font:400 21px var(--serif);line-height:1.2}.occasion-tile-copy small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:7px;color:#f2e7d5}
@media(max-width:900px){.occasion-catalogue{grid-template-columns:repeat(3,minmax(0,1fr))}.template-grid{gap:14px}}
@media(max-width:640px){.hero{padding-top:34px}.hero h1{font-weight:400}.template-grid{gap:10px}.template-thumb{height:175px}.template-info{padding:12px}.occasion-catalogue{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.occasion-tile{min-height:130px}.occasion-tile-copy{left:11px;bottom:11px}.occasion-tile-copy strong{font-size:18px}}

</style></head>

templates.push({id:'velvet-noir',name:'Velvet Noir',category:'Wedding',style:'Luxury',desc:'Ink-black details, champagne gold and a candlelit mood.',image:'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1000&q=85',colors:['#20201e','#c6a56b','#f4eee3']},{id:'ivory-heirloom',name:'Ivory Heirloom',category:'Wedding',style:'Classic',desc:'Quiet luxury with ivory paper tones and graceful type.',image:'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=85',colors:['#f7f2e9','#b6a17c','#6d7768']},{id:'botanical-atelier',name:'Botanical Atelier',category:'Wedding',style:'Botanical',desc:'Painterly greenery for a garden celebration.',image:'https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=1000&q=85',colors:['#e8eadf','#75846d','#c7b18a']},{id:'rosewater',name:'Rosewater',category:'Engagement',style:'Romantic',desc:'Blush accents, soft edges and intimate warmth.',image:'https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1000&q=85',colors:['#f0dcd7','#b87f80','#f8f1e8']},{id:'champagne-toast',name:'Champagne Toast',category:'Engagement',style:'Luxury',desc:'A polished celebration in champagne and cream.',image:'https://images.unsplash.com/photo-1511795409834-ef04bbd61622?auto=format&fit=crop&w=1000&q=85',colors:['#f5ebd8','#c3a46b','#6b6152']},{id:'little-moon',name:'Little Moon',category:'Baby Shower',style:'Soft',desc:'Dreamy neutrals and delicate details for a new arrival.',image:'https://images.unsplash.com/photo-1511895426328-dc8714191300?auto=format&fit=crop&w=1000&q=85',colors:['#eee5d8','#c8b5a0','#9caeaa']},{id:'baby-in-bloom',name:'Baby in Bloom',category:'Baby Shower',style:'Botanical',desc:'Fresh botanicals for a joyful welcome.',image:'https://images.unsplash.com/photo-1464207687429-7505649dae38?auto=format&fit=crop&w=1000&q=85',colors:['#f1e5d8','#b7c3a6','#d7a6a0']},{id:'little-luxe',name:'Little Luxe',category:'Baptism',style:'Classic',desc:'An understated, graceful design for a meaningful day.',image:'https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1000&q=85',colors:['#f8f3e9','#c8b58f','#b9c8c0']},{id:'confetti-club',name:'Confetti Club',category:'Birthday',style:'Playful',desc:'A bright, spirited invitation for a big personality.',image:'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=1000&q=85',colors:['#f4d8cb','#d4c3e8','#e6cb78']},{id:'forever-us',name:'Forever Us',category:'Anniversary',style:'Romantic',desc:'A refined celebration of years spent together.',image:'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=85',colors:['#f5eee1','#bca06c','#9d7a79']},{id:'new-chapter',name:'A New Chapter',category:'Graduation',style:'Editorial',desc:'A confident, modern design for the next beginning.',image:'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1000&q=85',colors:['#f4eee4','#a58a5b','#293c50']},{id:'something-blue',name:'Something Blue',category:'Bridal Shower',style:'Classic',desc:'Delicate blue accents and a polished, airy layout.',image:'https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1000&q=85',colors:['#f8f5ee','#9db3c2','#c8ad7f']},{id:'open-doors',name:'Open Doors',category:'Housewarming',style:'Warm Minimal',desc:'Natural textures for a warm welcome to your new home.',image:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1000&q=85',colors:['#eee7dc','#9eaa92','#b99b7b']},{id:'summit',name:'The Summit',category:'Corporate Event',style:'Modern',desc:'A confident, premium look for launches and gatherings.',image:'https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1000&q=85',colors:['#f4f0e8','#243d3b','#b49a6c']},{id:'studio-profile',name:'Studio Profile',category:'Portfolio',style:'Editorial',desc:'A considered portfolio layout with strong visual hierarchy.',image:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1000&q=85',colors:['#f4f1ea','#282824','#b99a6a']});

for (const [category] of categories) {
 if (!templates.some(t => t.category === category)) {

 }

const defaultFunctions=[{id:crypto.randomUUID(),title:'Welcome Dinner',date:'2027-08-23',time:'18:00',venue:'Grand Hyatt, Kochi',visible:true},{id:crypto.randomUUID(),title:'Wedding Ceremony',date:'2027-08-24',time:'10:00',venue:'Venue to be confirmed',visible:true},{id:crypto.randomUUID(),title:'Reception',date:'2027-08-24',time:'18:30',venue:'Venue to be confirmed',visible:true}];
let state={page:'home',category:'Wedding',filter:'All Templates',search:'',selectedTemplate:'eternal',setupStep:0,editorTab:'Sections',activeSection:'Events / Functions',device:'desktop',mobileEditorView:'edit',projects:[],currentId:null,modal:null,templateReturnToSetup:false};
function load(){try{state.projects=JSON.parse(localStorage.getItem('invitestudio-projects')||'[]')}catch{state.projects=[]}if(!state.projects.length){state.projects=[{id:crypto.randomUUID(),name:'Meera & Abin',category:'Wedding',templateId:'eternal',status:'Draft',updated:'Just now',title:'Meera & Abin',date:'2027-08-24',location:'Kochi, India',message:'We are so excited to celebrate this special chapter with our family and friends.',functions:defaultFunctions.map(f=>({...f})),theme:{background:'#f4eee4',accent:'#a77d4d',text:'#28241f'},story:'Every love story has its own rhythm. We cannot wait to celebrate ours with you.',published:false}] ;save()}}
function save(){try{localStorage.setItem('invitestudio-projects',JSON.stringify(state.projects));state.saveFailed=false;state.saveStatus='saved';return true}catch(e){state.saveFailed=true;state.saveStatus='failed';toast('Could not save this draft. Browser storage may be unavailable or full. Remove large images and retry.');return false}}
function categoryAlias(category){return category==='Baptism / Christening / Naming Ceremony'?'Baptism':category==='Wedding Anniversary'?'Anniversary':category==='Other / Custom Event'?'Other Event':category}function current(){return state.projects.find(p=>p.id===state.currentId)}function tpl(id){return templates.find(t=>t.id===id)||templates[0]}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function img(url,alt=''){return `<img src="${url}" alt="${esc(alt)}" loading="lazy" onerror="this.style.display='none'">`}
function toast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>root.innerHTML='',2600)}
function header(){return `<header class="topbar"><div class="brand" onclick="go('home')">Invite<span>Studio</span></div><nav class="nav"><a onclick="go('templates')">Templates</a><a onclick="document.getElementById('how')?.scrollIntoView({behavior:'smooth'})">How it works</a><a onclick="toast('Pricing plans will be added later')">Pricing</a><a onclick="toast('Help center coming soon')">Help</a></nav><div class="top-actions"><button class="btn" onclick="go('dashboard')">My projects</button><button class="btn dark" onclick="startCreate()">Get started ↗</button></div></header>`}
function footer(){return `<footer class="footer container"><div class="brand">Invite<span>Studio</span></div><div>Made for moments that matter. <span style="margin-left:8px">© 2026 InviteStudio</span></div></footer>`}
function templateCard(t){return `<article class="template-card"><div class="template-thumb">${img(t.image,t.name)}<span class="tag">${t.category}</span></div><div class="template-info"><h3>${t.name}</h3><p>${t.desc}</p><div class="template-foot"><div class="swatches">${t.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><button class="btn small" onclick="previewTemplate('${t.id}')">Preview ↗</button></div></div></article>`}
function home(){return `${header()}<main>
<section class="hero container">
 <div>
  <div class="eyebrow">Beautifully yours, from the very first click</div>
  <h1>Beautiful invitation websites for life’s <em>special moments.</em></h1>
  <p>Create a stunning, personalized website in minutes. Choose a template, add your details, and share your celebration with the people you love.</p>

  <div class="hero-note"><div class="avatars"><span></span><span></span><span></span></div><span>Thoughtfully designed for your most meaningful moments</span></div>

 <div class="hero-art">
  ${img(templates[0].image,'Elegant invitation website preview')}
  <div class="art-label"><div><strong>Meera & Abin</strong><small>Our day, our story · 24 August</small></div><span style="font-size:24px;color:#ad895c">✳</span></div>

 </div>
</section>
<section class="section container" style="padding-top:16px;padding-bottom:24px">
 <div class="section-head"><div><div class="eyebrow">Start with a moment</div><h2>What are you celebrating?</h2><p>Choose an occasion and find a design that feels like you.</p></div><button class="text-link" onclick="startCreate()">All event types ↗</button></div>
 <div class="categories home-categories">${[['Wedding','♡'],['Engagement','♢'],['Birthday','♧'],['Baptism','✳'],['Anniversary','♡'],['Baby Shower','♧'],['Celebration','✧'],['Other Event','＋']].map(([n,e])=>`<button class="category" onclick="startCreate('${n}')"><div class="emoji">${e}</div><strong>${n}</strong></button>`).join('')}</div>
</section>
<section class="container"><div class="benefit-strip">
 <div class="benefit-item"><span class="benefit-icon">✧</span><div><strong>Beautiful templates</strong><small>Designed for your big moments</small></div></div>
 <div class="benefit-item"><span class="benefit-icon">▣</span><div><strong>Easy to create</strong><small>No design skills needed</small></div></div>
 <div class="benefit-item"><span class="benefit-icon">↗</span><div><strong>Share instantly</strong><small>One link for your guests</small></div></div>
 <div class="benefit-item"><span class="benefit-icon">▯</span><div><strong>Works on every device</strong><small>Mobile, tablet and desktop</small></div></div>

<section class="section container home-template-section"><div class="section-head"><div><div class="eyebrow">A little inspiration</div><h2>Find your kind of beautiful.</h2><p>Start with a design. Make every detail your own.</p></div><button class="text-link" onclick="go('templates')">View all templates ↗</button></div><div class="template-grid">${templates.slice(0,4).map(templateCard).join('')}</div></section>

</main>${footer()}`}
function templatesPage(){const visible=templates.filter(t=>(state.category==='All'||t.category===state.category)&&(state.filter==='All Templates'||t.style===state.filter)&&(t.name+' '+t.category+' '+t.desc).toLowerCase().includes(state.search.toLowerCase()));return `${header()}<main class="container view"><div class="page-title"><div class="eyebrow">The template collection</div><h1>Find the feeling.</h1><p>Beautiful starting points, with room to make them your own.</p></div><div class="filters"><input class="search" placeholder="Search templates…" value="${esc(state.search)}" oninput="state.search=this.value;renderTemplatesOnly()">${['All Templates','Modern','Elegant','Minimal','Colorful','Editorial'].map(f=>`<button class="pill ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}<select class="search" style="margin-left:auto;min-width:150px" onchange="state.category=this.value;render()"><option value="All">All event types</option>${categories.map(([n])=>`<option ${state.category===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="template-grid" id="template-grid">${visible.map(templateCard).join('')||'<div class="empty" style="grid-column:1/-1">No templates match these filters. Clear your search or choose another style.</div>'}</div></main>${footer()}`}
function renderTemplatesOnly(){const el=document.getElementById('template-grid');if(!el)return;const visible=templates.filter(t=>(state.category==='All'||t.category===state.category)&&(state.filter==='All Templates'||t.style===state.filter)&&(t.name+' '+t.category+' '+t.desc).toLowerCase().includes(state.search.toLowerCase()));el.innerHTML=visible.map(templateCard).join('')||'<div class="empty" style="grid-column:1/-1">No templates match. Try another filter.</div>'}
function startCreate(cat){state.currentId=null;state.category=cat||'Wedding';state.selectedTemplate=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category))?.id||'eternal';state.setupStep=0;state.page='setup';render()}
function setupPage(){const steps=['Basics','Your story','Functions','Photos & style'];const p=current();return `${header()}<main class="container view"><div class="page-title"><div class="eyebrow">Let's make it yours</div><h1>Create your website</h1><p>Start with a few details. Everything can be changed later.</p></div><div class="flow-layout"><aside class="flow-sidebar">${steps.map((s,i)=>`<div class="flow-step ${state.setupStep===i?'active':''}"><span class="num">${i+1}</span>${s}</div>`).join('')}</aside><section class="panel">${setupContent()}<div class="flow-actions"><button class="btn" onclick="${state.setupStep===0?'if(saveSetupFields()){state.templateReturnToSetup=true;go(\'templates\')}':'setSetupStep(-1)'}">${state.setupStep===0?'Choose a different template':'← Back'}</button><button class="btn dark" onclick="setSetupStep(1)">${state.setupStep===3?'Open editor':'Continue →'}</button></div></section></div></main>${footer()}`}
function setupContent(){const p=current()||{};if(state.setupStep===0)return `<h2>First, the essentials.</h2><p class="intro">Tell us a little about the event. You can skip anything you're not ready to decide.</p><div class="form-grid"><div class="field"><label>What are you celebrating?</label><select id="eventCategory" onchange="state.category=this.value;const match=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(match)state.selectedTemplate=match.id">${categories.map(([n])=>`<option ${state.category===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Website title</label><input id="projectTitle" placeholder="e.g. Meera & Arjun" value="${esc(p.title||'')}"></div><div class="field"><label>Event date</label><input type="date" id="projectDate" value="${esc(p.date||'')}"></div><div class="field"><label>Main location <span class="muted">(optional)</span></label><input id="projectLocation" placeholder="City or venue" value="${esc(p.location||'')}"></div><div class="field full"><label>A short welcome message <span class="muted">(optional)</span></label><textarea id="projectMessage" placeholder="A few words for your guests…">${esc(p.message||'')}</textarea></div></div>`;if(state.setupStep===1)return `<h2>Tell your story.</h2><p class="intro">A few words can make the invitation feel personal. This step is entirely optional.</p><div class="form-grid"><div class="field full"><label>Your introduction</label><textarea id="projectStory" style="min-height:150px" placeholder="Share a little about the people or occasion…">${esc(p.story||'')}</textarea><small>Write as much or as little as you like.</small></div><div class="field"><label>Names or hosts <span class="muted">(optional)</span></label><input id="projectHosts" value="${esc(p.hosts||'')}" placeholder="Names to display"></div><div class="field"><label>Website language</label><select id="projectLocale">${['English','Malayalam','Tamil','Hindi','Other'].map(locale=>`<option ${((p.locale||'English')===locale)?'selected':''}>${locale}</option>`).join('')}</select></div></div>`;if(state.setupStep===2)return `<h2>What happens on the day?</h2><p class="intro">Add as many functions as you need. Use any names that suit your event.</p>${functionRows(p)}<button class="btn" onclick="addFunction()">＋ Add another function</button><p class="tiny muted" style="margin-top:12px">Dates, times and venues are optional while you're drafting.</p>`;return `<h2>Curate your experience.</h2><p class="intro">Choose a design, then set your preferences. You can change everything later.</p><div class="template-grid" style="grid-template-columns:repeat(2,1fr)">${templates.filter(t=>t.category===state.category||t.category===categoryAlias(state.category)).slice(0,4).map(t=>`<button style="text-align:left;padding:0;border-radius:12px;overflow:hidden;border:2px solid ${state.selectedTemplate===t.id?'#b18a5b':'transparent'};background:white" onclick="state.selectedTemplate='${t.id}';render()"><div style="height:150px">${img(t.image,t.name)}</div><div style="padding:10px"><strong>${t.name}</strong><div class="tiny muted">${t.style} · ${t.category}</div></div></button>`).join('')||templates.slice(0,4).map(templateCard).join('')}</div><div class="preference-grid" style="margin-top:22px">
<div class="preference-choice"><label for="prefMood">Overall mood</label><select id="prefMood">${[['elegant','Elegant & timeless'],['minimal','Modern & minimal'],['romantic','Romantic & floral'],['playful','Playful & colorful'],['dramatic','Bold & dramatic'],['warm','Warm & intimate']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.mood||'elegant')===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="preference-choice"><label for="prefPalette">Colour palette</label><select id="prefPalette">${[['champagne','Champagne & ivory'],['sage','Sage & cream'],['blush','Blush & rose'],['noir','Black & gold'],['blue','Dusty blue & silver'],['earth','Terracotta & earth']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.palette||'champagne')===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="preference-choice"><label for="prefTypography">Typography</label><select id="prefTypography">${[['serif','Classic serif'],['sans','Modern sans serif'],['editorial','Editorial mix'],['script','Soft handwritten accents']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.typography||'serif')===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="preference-choice"><label for="prefLayout">Page layout</label><select id="prefLayout">${[['editorial','Editorial & image-led'],['minimal','Minimal and spacious'],['centered','Classic centered invitation'],['gallery','Gallery first']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.layout||'editorial')===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="preference-choice"><label for="prefRsvp">Guest response</label><select id="prefRsvp">${[['count','RSVP and guest count'],['rsvp','RSVP only'],['contact','Contact details only'],['none','No response form']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.rsvp||'count')===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="preference-choice"><label for="prefGallery">Photos and memories</label><select id="prefGallery">${[['gallery','Elegant photo gallery'],['hero','One hero image only'],['story','Story-led with a few photos'],['none','No photo gallery']].map(([v,l])=>`<option value="${v}" ${(p.preferences?.gallery||'gallery')===v?'selected':''}>${l}</option>`).join('')}</select></div>
</div><div class="field" style="margin-top:20px"><label>Custom accent colour</label><div style="display:flex;gap:10px;align-items:center"><input type="color" id="accentColor" value="${p.theme?.accent||'#a88754'}" style="width:55px;height:40px;padding:3px"><span class="tiny muted">Your choices are saved with this draft.</span></div></div><div class="choice-note">A few guided choices help us personalize the first draft. Fine-tune the content, photos, sections and colours in the editor whenever you like.</div>`}
function functionRows(p){return (p.functions||[]).map((f,i)=>`<div class="list-row"><div style="font-size:18px;color:#ad895c">✳</div><div class="row-content"><strong>${esc(f.title)}</strong><small>${esc(f.date||'Date not set')}${f.time?' · '+esc(f.time):''} · ${esc(f.venue||'Venue not set')}</small><small>${f.visible===false?'Hidden from guests':'Visible to guests'}</small></div><div class="row-buttons"><button class="icon-btn" title="Move up" aria-label="Move '+esc(f.title)+' up" onclick="moveFunction('${f.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="icon-btn" title="Move down" aria-label="Move '+esc(f.title)+' down" onclick="moveFunction('${f.id}',1)" ${i===p.functions.length-1?'disabled':''}>↓</button><button class="icon-btn" title="Toggle visibility" aria-label="Toggle visibility for ${esc(f.title)}" onclick="toggleFunction('${f.id}')">${f.visible===false?'◉':'◌'}</button><button class="icon-btn" title="Edit" aria-label="Edit ${esc(f.title)}" onclick="editFunction('${f.id}')">✎</button><button class="icon-btn" title="Duplicate" aria-label="Duplicate ${esc(f.title)}" onclick="duplicateFunction('${f.id}')">▣</button><button class="icon-btn" title="Remove" aria-label="Remove ${esc(f.title)}" onclick="removeFunction('${f.id}')">×</button></div></div>`).join('')||'<div class="empty">No functions added yet. You can add them later.</div>'}
function ensureProject(){let p=current();if(!p){p={id:crypto.randomUUID(),name:'Untitled event',category:state.category,templateId:state.selectedTemplate,status:'Draft',updated:'Just now',title:'',date:'',location:'',message:'',story:'',functions:[],theme:{background:'#f4eee4',accent:'#a77d4d',text:'#28241f'},published:false};state.projects.unshift(p);state.currentId=p.id}return p}
function setSetupStep(delta){if(!saveSetupFields())return;if(state.setupStep===3&&delta>0){const p=ensureProject();if(!String(p.title||'').trim()){toast('Add a website title in Basics before opening the editor.');state.setupStep=0;render();return}p.templateId=state.selectedTemplate;p.category=state.category;p.theme.accent=document.getElementById('accentColor')?.value||p.theme.accent;p.name=p.title||p.name;p.updated='Just now';save();state.page='editor';render();return}state.setupStep=Math.max(0,Math.min(3,state.setupStep+delta));render()}
function saveSetupFields(){let p=current();if(!p&&state.setupStep===0){p=ensureProject()}if(!p)return true;const v=id=>document.getElementById(id)?.value;const previousCategory=p.category;if(v('eventCategory')){state.category=v('eventCategory');p.category=state.category;if(previousCategory!==state.category){const compatible=templates.find(t=>t.category===state.category||t.category===categoryAlias(state.category));if(compatible)state.selectedTemplate=compatible.id;}}if(v('projectTitle')!==undefined)p.title=v('projectTitle');if(v('projectDate')!==undefined)p.date=v('projectDate');if(v('projectLocation')!==undefined)p.location=v('projectLocation');if(v('projectMessage')!==undefined)p.message=v('projectMessage');if(v('projectStory')!==undefined)p.story=v('projectStory');if(v('projectHosts')!==undefined)p.hosts=v('projectHosts');if(v('projectLocale')!==undefined)p.locale=v('projectLocale');const prefValues={mood:v('prefMood'),palette:v('prefPalette'),typography:v('prefTypography'),layout:v('prefLayout'),rsvp:v('prefRsvp'),gallery:v('prefGallery')};p.preferences={...(p.preferences||{})};Object.entries(prefValues).forEach(([key,value])=>{if(value!==undefined)p.preferences[key]=value});p.name=p.title||p.name;p.category=state.category;p.templateId=state.selectedTemplate;return save()}
function addFunction(){saveSetupFields();const p=ensureProject();p.functions.push({id:crypto.randomUUID(),title:'New function',date:'',time:'',venue:'',visible:true});save();render();editFunction(p.functions[p.functions.length-1].id)}function editFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!f)return;state.modal={type:'function',id};renderModal(`<h2 id="modal-title">Edit function</h2><p class="muted">Use any title that fits your event. All fields except the title are optional.</p><div class="form-grid"><div class="field full"><label for="fnTitle">Function name</label><input id="fnTitle" value="${esc(f.title)}" placeholder="e.g. Wedding Ceremony" required></div><div class="field"><label for="fnDate">Date</label><input type="date" id="fnDate" value="${esc(f.date||'')}"></div><div class="field"><label for="fnTime">Start time</label><input type="time" id="fnTime" value="${esc(f.time||'')}"></div><div class="field"><label for="fnEndTime">End time</label><input type="time" id="fnEndTime" value="${esc(f.endTime||'')}"></div><div class="field"><label for="fnDress">Dress code</label><input id="fnDress" value="${esc(f.dressCode||'')}"></div><div class="field full"><label for="fnVenue">Venue</label><input id="fnVenue" value="${esc(f.venue||'')}" placeholder="Venue name or address"></div><div class="field full"><label for="fnDirections">Directions link</label><input id="fnDirections" type="url" value="${esc(f.directionsUrl||'')}" placeholder="https://…"></div><div class="field full"><label for="fnDescription">Description or guest notes</label><textarea id="fnDescription">${esc(f.description||'')}</textarea></div><div class="field full"><label><input id="fnVisible" type="checkbox" ${f.visible===false?'':'checked'} style="width:auto"> Show this function on the invitation</label></div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn dark" onclick="saveFunction('${id}')">Save function</button></div>`)}function saveFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const title=document.getElementById('fnTitle').value.trim();if(!title){document.getElementById('fnTitle').setCustomValidity('Please enter a function name.');document.getElementById('fnTitle').reportValidity();return}f.title=title;f.date=document.getElementById('fnDate').value;f.time=document.getElementById('fnTime').value;f.endTime=document.getElementById('fnEndTime').value;f.venue=document.getElementById('fnVenue').value.trim();f.directionsUrl=document.getElementById('fnDirections').value.trim();f.description=document.getElementById('fnDescription').value.trim();f.dressCode=document.getElementById('fnDress').value.trim();f.visible=document.getElementById('fnVisible').checked;if(!save())return;closeModal();render();toast('Function saved locally')}function removeFunction(id){const p=current();if(!p)return;const f=p.functions.find(x=>x.id===id);if(!f||!confirm(`Remove “${f.title}” from this draft? This cannot be undone in the prototype.`))return;p.functions=p.functions.filter(x=>x.id!==id);save();render();toast('Function removed')}function moveFunction(id,delta){const p=current();if(!p)return;const i=p.functions.findIndex(f=>f.id===id),j=i+delta;if(i<0||j<0||j>=p.functions.length)return;[p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]];if(save())render();else [p.functions[i],p.functions[j]]=[p.functions[j],p.functions[i]]}function toggleFunction(id){const f=current()?.functions.find(x=>x.id===id);if(!f)return;const previous=f.visible;f.visible=f.visible===false;if(save())render();else f.visible=previous}function duplicateFunction(id){const p=current();const f=p?.functions.find(x=>x.id===id);if(!p||!f)return;const copy={...f,id:crypto.randomUUID(),title:f.title+' (copy)'};p.functions.splice(p.functions.indexOf(f)+1,0,copy);save();render();toast('Function duplicated')}
function editor(){const p=current()||ensureProject();const t=tpl(p.templateId);return `${header()}<div class="editor-shell"><aside class="editor-rail">${[['Sections','▤'],['Content','✎'],['Events / Functions','✳'],['Photos','▧'],['Theme','◐'],['Settings','⚙']].map(([n,i])=>`<button class="rail-item ${state.editorTab===n?'active':''}" onclick="state.editorTab='${n}';state.activeSection='${n}';render()"><span>${i}</span>${n.split(' ')[0]}</button>`).join('')}<button class="rail-item" style="margin-top:auto" onclick="go('dashboard')"><span>⌂</span>Projects</button></aside><aside class="editor-panel ${state.mobileEditorView==='preview'?'mobile-hidden':state.mobileEditorView==='sections'?'mobile-sections':''}">${editorPanel(p,t)}</aside><main class="editor-canvas ${state.mobileEditorView==='edit'||state.mobileEditorView==='sections'?'mobile-hidden':''}"><div class="editor-toolbar"><div class="mobile-editor-modes"><button class="pill ${state.mobileEditorView==='edit'?'active':''}" onclick="state.mobileEditorView='edit';render()">Edit</button><button class="pill ${state.mobileEditorView==='preview'?'active':''}" onclick="state.mobileEditorView='preview';render()">Preview</button><button class="pill ${state.mobileEditorView==='sections'?'active':''}" onclick="state.mobileEditorView='sections';state.editorTab='Sections';render()">Sections</button></div><div class="left"><button class="btn small" onclick="go('dashboard')">← Projects</button><span class="status" role="status" aria-live="polite"><i class="dot"></i> ${state.saveFailed?'Save failed — retry':'Saved locally'}</span></div><div class="right"><button class="btn small" onclick="state.page='preview';render()">Preview ↗</button><button class="btn dark small" onclick="openPublish()">Publish</button></div></div><div class="device-frame" id="live-preview">${sitePreview(p,t,false)}</div></main></div>`}
function editorPanel(p,t){if(state.editorTab==='Events / Functions')return `<h3>Events & functions</h3><p class="tiny muted">Add the moments your guests need to know about.</p>${functionRows(p)}<button class="btn small" onclick="addFunction()">＋ Add function</button>`;if(state.editorTab==='Theme')return `<h3>Your visual style</h3><p class="tiny muted">Small details, your way.</p><div class="editor-control"><label>Accent color</label><input type="color" value="${p.theme.accent}" onchange="updateTheme('accent',this.value)"></div><div class="editor-control"><label>Background color</label><input type="color" value="${p.theme.background}" onchange="updateTheme('background',this.value)"></div><div class="editor-control"><label>Template</label><select onchange="updateTemplate(this.value)">${templates.map(x=>`<option value="${x.id}" ${p.templateId===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div><button class="btn small" onclick="resetTheme()">Reset theme</button>`;if(state.editorTab==='Photos')return `<h3>Photos</h3><p class="tiny muted">Images are stored locally in this browser for prototype testing only.</p><div class="editor-control"><label for="photoUpload">Add photos</label><input id="photoUpload" type="file" accept="image/*" multiple onchange="handlePhotoUpload(this.files)"><small>Choose up to 4 images, max 1 MB each. Large uploads may exceed browser storage.</small></div><div class="photo-grid">${(p.photos||[]).map((ph,i)=>`<div class="photo-tile"><img src="${ph.data}" alt="${esc(ph.alt||'Event photo')}"><input aria-label="Photo alternative text" value="${esc(ph.alt||'')}" placeholder="Describe photo" onchange="updatePhotoAlt(${i},this.value)"><button class="btn small" onclick="removePhoto(${i})">Remove</button></div>`).join('')||'<div class="empty">No uploaded photos yet.</div>'}</div>`;if(state.editorTab==='Settings')return `<h3>Website settings</h3><div class="editor-control"><label>Website title</label><input value="${esc(p.title)}" oninput="updateProject('title',this.value)"></div><div class="editor-control"><label>Event category</label><select onchange="updateProject('category',this.value)">${categories.map(([n])=>`<option ${p.category===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="editor-control"><label>Event date</label><input type="date" value="${esc(p.date)}" onchange="updateProject('date',this.value)"></div><div class="editor-control"><label>Location</label><input value="${esc(p.location)}" oninput="updateProject('location',this.value)"></div>`;if(state.editorTab==='Content')return `<h3>Content</h3><p class="tiny muted">Edit your invitation text and see it update in the preview.</p><div class="editor-control"><label>Main title</label><input value="${esc(p.title)}" oninput="updateProject('title',this.value)"></div><div class="editor-control"><label>Welcome message</label><textarea oninput="updateProject('message',this.value)">${esc(p.message)}</textarea></div><div class="editor-control"><label>Our story</label><textarea oninput="updateProject('story',this.value)">${esc(p.story)}</textarea></div><div class="editor-control"><label>Location</label><input value="${esc(p.location)}" oninput="updateProject('location',this.value)"></div>`;const registry=[['hero','Hero','Opening moment'],['welcome','Welcome message','A note for your guests'],['story','Our story','Your story or introduction'],['functions','Events / Functions','Dates, times and venues'],['gallery','Gallery','Photos from your life'],['rsvp','RSVP','Guest response form']];p.sections=p.sections||registry.map(([id,title])=>({id,title,visible:true}));return `<h3>Page sections</h3><p class="tiny muted">Show, hide and reorder sections. Add a custom section for any content not covered by the defaults.</p><button class="btn small" onclick="addCustomSection()">＋ Add custom section</button>${p.sections.map((sec,i)=>`<div class="list-row"><div class="row-content"><strong>${esc(sec.title)}</strong><small>${sec.visible?'Visible on website':'Hidden from website'}</small></div><div class="row-buttons"><button class="icon-btn" aria-label="Move ${esc(sec.title)} up" onclick="moveSection('${sec.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="icon-btn" aria-label="Move ${esc(sec.title)} down" onclick="moveSection('${sec.id}',1)" ${i===p.sections.length-1?'disabled':''}>↓</button><button class="icon-btn" aria-label="Toggle ${esc(sec.title)} visibility" onclick="toggleSection('${sec.id}')">${sec.visible?'◉':'◌'}</button><button class="icon-btn" aria-label="Edit ${esc(sec.title)}" onclick="openSection('${sec.id}')">✎</button>${sec.custom?`<button class="icon-btn" aria-label="Remove ${esc(sec.title)}" onclick="removeCustomSection('${sec.id}')">×</button>`:''}</div></div>`).join('')}${p.sections.some(sec=>sec.custom&&sec.id===state.activeSection)?`<div class="editor-control"><label>Custom section title</label><input value="${esc(p.sections.find(sec=>sec.id===state.activeSection)?.title||'')}" oninput="updateCustomSection('${state.activeSection}','title',this.value)"><label style="margin-top:10px">Section content</label><textarea oninput="updateCustomSection('${state.activeSection}','content',this.value)">${esc(p.sections.find(sec=>sec.id===state.activeSection)?.content||'')}</textarea></div>`:''}<div class="editor-control"><label>Website title</label><input value="${esc(p.title)}" oninput="updateProject('title',this.value)"></div><div class="editor-control"><label>Welcome message</label><textarea oninput="updateProject('message',this.value)">${esc(p.message)}</textarea></div>`}
function addCustomSection(){const p=current();if(!p)return;p.sections=p.sections||[{id:'hero',title:'Hero',visible:true},{id:'welcome',title:'Welcome message',visible:true},{id:'story',title:'Our story',visible:true},{id:'functions',title:'Events / Functions',visible:true},{id:'gallery',title:'Gallery',visible:true},{id:'rsvp',title:'RSVP',visible:true}];const sec={id:crypto.randomUUID(),title:'New section',content:'Add your message here.',visible:true,custom:true};p.sections.push(sec);state.activeSection=sec.id;save();render()}function updateCustomSection(id,key,value){const sec=current()?.sections?.find(x=>x.id===id&&x.custom);if(!sec)return;sec[key]=value;save();refreshPreview()}function removeCustomSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id&&x.custom);if(!p||!sec||!confirm(`Remove “${sec.title}” from this draft?`))return;p.sections=p.sections.filter(x=>x.id!==id);state.activeSection='Sections';save();render()}function openSection(id){const map={hero:'Content',welcome:'Content',story:'Content',functions:'Events / Functions',gallery:'Photos',rsvp:'Settings'};state.activeSection=id;state.editorTab=map[id]||(current()?.sections?.find(x=>x.id===id)?.custom?'Sections':'Content');render()}function moveSection(id,delta){const p=current();if(!p)return;const a=p.sections||[],i=a.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(save())render();else [a[i],a[j]]=[a[j],a[i]]}function toggleSection(id){const p=current();const sec=p?.sections?.find(x=>x.id===id);if(!sec)return;const previous=sec.visible;sec.visible=!sec.visible;if(save()){render();refreshPreview()}else sec.visible=previous}function updateProject(key,value){const p=current();if(!p)return;p[key]=value;if(key==='title')p.name=value||'Untitled event';if(key==='category'){state.category=value;const compatible=templates.find(t=>t.category===value||t.category===categoryAlias(value));if(compatible){p.templateId=compatible.id;state.selectedTemplate=compatible.id}}p.updated='Just now';if(save())refreshPreview()}function handlePhotoUpload(files){const p=current();if(!p)return;const previous=p.photos||[];const remaining=Math.max(0,4-previous.length);if(!remaining){toast('Photo limit reached. Remove a photo before adding another.');return}if(files.length>remaining)toast(`Only ${remaining} photo slot(s) remain; extra files will be ignored.`);const selected=[...files].slice(0,remaining);Promise.all(selected.map(file=>new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')||file.size>1024*1024){reject(new Error(`${file.name}: choose an image under 1 MB.`));return}const reader=new FileReader();reader.onload=()=>resolve({data:reader.result,alt:file.name.replace(/\.[^.]+$/,'')});reader.onerror=()=>reject(new Error('Could not read image.'));reader.readAsDataURL(file)}))).then(items=>{p.photos=[...previous,...items].slice(0,4);if(!save()){p.photos=previous;return}render();toast('Photos added to this browser draft')}).catch(e=>toast(e.message)).finally(()=>{const input=document.getElementById('photoUpload');if(input)input.value=''})}function updatePhotoAlt(i,value){const p=current();if(!p?.photos?.[i])return;p.photos[i].alt=value;save()}function removePhoto(i){const p=current();if(!p?.photos)return;const previous=[...p.photos];p.photos.splice(i,1);if(save())render();else p.photos=previous}function updateTheme(key,value){const p=current();if(!p)return;const previous=p.theme[key];p.theme[key]=value;if(save())refreshPreview();else p.theme[key]=previous}function updateTemplate(id){const p=current();if(!p)return;const previous=p.templateId;p.templateId=id;if(save())render();else p.templateId=previous}function resetTheme(){const p=current();if(!p)return;const previous={...p.theme};p.theme={background:'#f4eee4',accent:'#a77d4d',text:'#28241f'};if(save())render();else p.theme=previous}
function sitePreview(p,t,full){
 const title=p.title||p.name||'Your celebration';
 const date=p.date?new Date(p.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'Date to be announced';
 const fns=(p.functions||[]).filter(f=>f.visible!==false);
 const registry=p.sections||[{id:'hero',visible:true},{id:'welcome',visible:true},{id:'story',visible:true},{id:'functions',visible:true},{id:'gallery',visible:true},{id:'rsvp',visible:true}];
 const visible=id=>registry.find(sec=>sec.id===id)?.visible!==false;
 const parts={
  hero: visible('hero')?`<section class="preview-hero" style="background:${p.theme.background}">${img(t.image,t.name)}<div class="preview-copy" style="color:${p.theme.text}"><div class="mini">${esc(p.category||'A special occasion')}</div><h2>${esc(title)}</h2><p>${esc(p.message||'Together with our favourite people, for a day to remember.')}</p><div class="date">${esc(date.toUpperCase())}${p.location?' · '+esc(p.location.toUpperCase()):''}</div><div style="margin-top:24px"><span style="background:${p.theme.accent};color:white;padding:11px 21px;border-radius:4px;font-size:10px;letter-spacing:1px">YOU'RE INVITED</span></div></div></section>`:'',
  welcome: visible('welcome')?`<section class="preview-section" style="background:#fffdf8;color:${p.theme.text}"><div class="eyebrow" style="justify-content:center">A day to remember</div><h3>We'd love to celebrate with you.</h3></section>`:'',
  story: visible('story')?`<section class="preview-section" style="background:#fffdf8;color:${p.theme.text}"><p style="max-width:470px;margin:0 auto;color:#79766f;line-height:1.8">${esc(p.story||'The best moments are the ones we share. We look forward to celebrating together.')}</p></section>`:'',
  functions: visible('functions')&&fns.length?`<section class="preview-section" style="background:${p.theme.background}"><h3>The celebrations</h3><div class="function-preview">${fns.map(f=>`<div class="function-chip"><strong>${esc(f.title)}</strong><div style="color:#79766f;margin-top:5px">${esc(f.date||'Date to be announced')}${f.time?' · '+esc(f.time):''}${f.endTime?'–'+esc(f.endTime):''}</div><div style="color:#79766f;margin-top:4px">${esc(f.venue||'Venue to be announced')}</div>${f.description?`<p style="margin:8px 0 0;font-size:12px">${esc(f.description)}</p>`:''}${f.dressCode?`<small>Dress code: ${esc(f.dressCode)}</small>`:''}${f.directionsUrl?`<p><a href="${esc(f.directionsUrl)}" target="_blank" rel="noopener noreferrer">Directions ↗</a></p>`:''}</div>`).join('')}</div></section>`:'',
  gallery: visible('gallery')?((p.photos||[]).length?`<section class="preview-section" style="background:#fffdf8"><h3>Gallery</h3><div class="photo-grid public-gallery">${p.photos.map(ph=>`<img src="${ph.data}" alt="${esc(ph.alt||'Event photo')}">`).join('')}</div></section>`:'<section class="preview-section" style="background:#fffdf8"><h3>Gallery</h3><p style="color:#79766f">Photos will be added here.</p></section>'):'',
  rsvp: visible('rsvp')?`<section class="preview-section" style="background:#fffdf8"><h3>Save the date</h3><p style="color:#79766f">${esc(date)}</p><button class="btn dark" onclick="toast('RSVP preview only — backend not connected')">RSVP</button></section>`:''
 };
 const body=registry.map(sec=>parts[sec.id]||(sec.custom&&sec.visible!==false?`<section class="preview-section" style="background:#fffdf8;color:${p.theme.text}"><h3>${esc(sec.title)}</h3><p style="max-width:600px;margin:0 auto;line-height:1.8">${esc(sec.content||'')}</p></section>`:'')).join('');
 return `<nav class="preview-nav" style="background:${p.theme.background};color:${p.theme.text}"><strong style="font-family:var(--serif);font-size:16px">${esc(title)}</strong><span>OUR STORY　 EVENTS　 GALLERY　 RSVP</span></nav>${body}<footer style="padding:22px;text-align:center;background:${p.theme.background};font-family:var(--serif);font-size:17px">Made with love ✳</footer>`;
}
function refreshPreview(){const p=current();const el=document.getElementById('live-preview');if(el&&p)el.innerHTML=sitePreview(p,tpl(p.templateId),false)}
function dashboard(){return `${header()}<main class="container view"><div class="page-title dashboard-head"><div><div class="eyebrow">Your creative space</div><h1>My projects</h1><p>Pick up where you left off, or start something new.</p></div><button class="btn dark" onclick="startCreate()">＋ Create a website</button></div><div class="project-grid">${state.projects.map(p=>`<article class="project-card"><div class="project-cover">${img(tpl(p.templateId).image,p.name)}<span class="tag">${p.status||'Draft'}</span></div><div class="project-body"><h3>${esc(p.name||p.title||'Untitled event')}</h3><p>${esc(p.category)} · Edited ${esc(p.updated||'recently')}</p><div class="project-actions"><button class="btn small dark" onclick="openProject('${p.id}')">Edit</button><button class="btn small" onclick="previewProject('${p.id}')">Preview</button><button class="btn small" onclick="duplicateProject('${p.id}')">Duplicate</button></div></div></article>`).join('')}<button class="project-card" style="border:1px dashed #d3c9ba;background:transparent;display:grid;place-items:center;min-height:280px;color:#7d766b" onclick="startCreate()"><span style="font-size:32px">＋</span><strong>Start a new project</strong><span class="tiny">A new moment begins here</span></button></div></main>${footer()}`}
function openProject(id){state.currentId=id;state.page='editor';state.editorTab='Sections';render()}function duplicateProject(id){const p=state.projects.find(x=>x.id===id);const copy=JSON.parse(JSON.stringify(p));copy.id=crypto.randomUUID();copy.name=(p.name||'Project')+' copy';copy.title=(p.title||'')+' copy';copy.status='Draft';copy.published=false;copy.updated='Just now';copy.functions=(copy.functions||[]).map(f=>({...f,id:crypto.randomUUID()}));state.projects.unshift(copy);save();render();toast('Project duplicated')}
function previewTemplate(id){const t=tpl(id);state.selectedTemplate=id;state.modal={type:'template',id};renderModal(`<div class="template-detail-modal"><div class="template-detail-art">${img(t.image,t.name+' template preview')}<span class="tag">${esc(t.category)} · ${esc(t.style)}</span></div><div class="template-detail-copy"><div class="eyebrow">A design to make your own</div><h2 id="modal-title">${esc(t.name)}</h2><p class="muted">${esc(t.desc)} A thoughtful starting point for a celebration that feels uniquely yours.</p><div class="template-detail-swatches">${t.colors.map(c=>`<i style="background:${c}" title="Theme color"></i>`).join('')}</div><div class="template-detail-benefits"><span>Customize your colors and content</span><span>Personalize sections and event details</span><span>Preview on desktop, tablet and mobile</span><span>Designed for a polished guest experience</span></div><div class="template-detail-actions"><button class="btn dark" onclick="chooseTemplate('${id}')">Use this template →</button><button class="btn" onclick="closeModal()">Back to templates</button></div></div></div>`)} function chooseTemplate(id){const wasSetup=state.page==='setup'||state.templateReturnToSetup;if(state.page==='setup'&&!saveSetupFields())return;state.selectedTemplate=id;state.category=tpl(id).category;closeModal();if(wasSetup){state.templateReturnToSetup=false;const p=current();if(p){p.templateId=id;p.category=state.category;if(!save())return}state.setupStep=0;state.page='setup';render();return}startCreate(state.category);state.selectedTemplate=id;render()}
function previewProject(id){state.currentId=id;state.page='preview';render()}
function previewPage(){const p=current()||ensureProject();return `<header class="topbar"><div class="brand" onclick="go('dashboard')">Invite<span>Studio</span></div><div class="top-actions"><button class="btn" onclick="go('editor')">← Back to editor</button><button class="btn dark" onclick="openPublish()">Publish</button></div></header><main class="container" style="padding:22px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><div><strong>Website preview</strong><div class="tiny muted">This is a preview. Publishing is simulated in this frontend prototype.</div></div><div class="filters" style="margin:0"><button class="pill ${state.device==='desktop'?'active':''}" onclick="state.device='desktop';render()">Desktop</button><button class="pill ${state.device==='tablet'?'active':''}" onclick="state.device='tablet';render()">Tablet</button><button class="pill ${state.device==='mobile'?'active':''}" onclick="state.device='mobile';render()">Mobile</button></div></div><div style="max-width:${state.device==='mobile'?'390px':state.device==='tablet'?'768px':'100%'};margin:auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white">${sitePreview(p,tpl(p.templateId),true)}</div></main>`}
function openPublish(){const p=current();if(!p)return;state.modal={type:'publish'};renderModal(`<div class="eyebrow">Almost ready</div><h2>Share your website with the world.</h2><p class="muted">This frontend demo can simulate publishing. No public website or backend is created yet.</p><div class="field"><label>Website address (demo)</label><input id="slug" value="invitestudio.local/${(p.name||'your-event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}"></div><div style="background:#f2eee6;padding:14px;border-radius:9px;margin-top:15px;font-size:12px;line-height:1.6">✓ Preview ready<br>✓ Draft saved in this browser<br>○ Real public URL — requires backend and hosting</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Not yet</button><button class="btn dark" onclick="simulatePublish()">Mark as published</button></div>`)}function simulatePublish(){const p=current();p.status='Published (demo)';p.published=true;p.slug=document.getElementById('slug')?.value||'';p.updated='Just now';if(!save())return;closeModal();go('dashboard');toast('Marked as published in this browser demo only')}
function renderModal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal ${content.includes('template-detail-modal')?'template-detail-shell':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">${content}</section></div>`;const dlg=document.querySelector('[role=dialog]');dlg?.focus();dlg?.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...dlg.querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})}function closeModal(){state.modal=null;document.getElementById('modal-root').innerHTML=''}
function go(page){state.page=page;render()}function render(){document.getElementById('app').innerHTML=state.page==='home'?home():state.page==='templates'?templatesPage():state.page==='setup'?setupPage():state.page==='editor'?editor():state.page==='dashboard'?dashboard():state.page==='preview'?previewPage():home();window.scrollTo({top:0,behavior:'instant'})}
load();render();
</script></body></html>
