<!doctype html><meta charset="utf-8"><title>InviteStudio regression tests</title><pre id="results">RUNNING</pre><iframe id="app" src="index.html" style="width:1200px;height:900px"></iframe><script>
const results=[];function test(name,fn){try{fn();results.push('PASS '+name)}catch(e){results.push('FAIL '+name+' — '+e.message)}}
const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;try{
 test('App renders homepage',()=>{if(!d.body.innerText.includes('Beautiful websites'))throw Error('homepage text missing')});
 test('Full event category list is available',()=>{if(w.categories.length<15)throw Error('only '+w.categories.length+' categories')});
 test('Category change chooses compatible template',()=>{w.startCreate('Baptism / Christening / Naming Ceremony');w.saveSetupFields();const p=w.current();if(!p||p.category!=='Baptism / Christening / Naming Ceremony')throw Error('category not persisted');if(!w.templates.some(t=>t.id===w.state.selectedTemplate))throw Error('template missing')});
 test('Setup fields persist on navigation',()=>{w.state.setupStep=0;w.render();d.getElementById('projectTitle').value='QA Test Event';d.getElementById('projectDate').value='2027-01-02';d.getElementById('projectLocation').value='Test venue';if(!w.saveSetupFields())throw Error('save failed');w.setSetupStep(1);if(w.current().title!=='QA Test Event'||w.current().date!=='2027-01-02'||w.current().location!=='Test venue')throw Error('setup values lost')});
 test('Locale restores selected value',()=>{w.current().locale='Malayalam';w.state.setupStep=1;w.render();const sel=d.getElementById('projectLocale');if(!sel||sel.value!=='Malayalam')throw Error('locale not restored')});
 test('Function create, duplicate, reorder and visibility',()=>{const p=w.current();p.functions=[];w.addFunction();if(p.functions.length!==1)throw Error('add failed');const id=p.functions[0].id;w.duplicateFunction(id);if(p.functions.length!==2||p.functions[0].id===p.functions[1].id)throw Error('duplicate failed');w.moveFunction(p.functions[1].id,-1);w.toggleFunction(p.functions[0].id);if(p.functions[0].visible!==false)throw Error('visibility failed')});
 test('Sections can be added, reordered and hidden',()=>{const p=w.current();p.sections=[{id:'hero',title:'Hero',visible:true},{id:'story',title:'Story',visible:true}];w.addCustomSection();const custom=p.sections.find(s=>s.custom);if(!custom)throw Error('custom section not added');w.moveSection('story',-1);if(p.sections[0].id!=='story')throw Error('reorder failed');w.toggleSection('hero');if(p.sections.find(s=>s.id==='hero').visible!==false)throw Error('hide failed')});
 test('Empty gallery has a clear preview state',()=>{const p=w.current();p.photos=[];p.sections=[{id:'gallery',title:'Gallery',visible:true}];const html=w.sitePreview(p,w.tpl(p.templateId),false);if(!html.includes('Photos will be added here'))throw Error('empty state missing')});
 test('Photo limit handles full capacity',()=>{const p=w.current();p.photos=[1,2,3,4];w.handlePhotoUpload([]);if(p.photos.length!==4)throw Error('photos changed')});
 test('Draft persists through localStorage',()=>{const p=w.current();p.title='Persisted QA';if(!w.save())throw Error('save false');const data=JSON.parse(w.localStorage.getItem('invitestudio-projects'));if(!data.some(x=>x.title==='Persisted QA'))throw Error('draft missing')});
 test('Template switching in setup retains project',()=>{const id=w.current().id;w.state.page='setup';w.chooseTemplate(w.templates[0].id);if(w.current().id!==id)throw Error('project identity changed')});
} catch(e){results.push('HARNESS ERROR '+e.stack)}document.getElementById('results').textContent=results.join('\n')+'\n\nSUMMARY: '+results.filter(x=>x.startsWith('PASS')).length+' passed, '+results.filter(x=>x.startsWith('FAIL')).length+' failed';});
</script>
